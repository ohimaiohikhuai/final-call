<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Chatrix · Pro Video Calls</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        /* equal video layout */
        .call-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
        }

        .videos-grid {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 0; /* flex limitation fix */
        }

        .video-wrapper {
            flex: 1;
            background: #1a1a1a;
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            background-color: #121212;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            border: 1px solid #2c2c2c;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
            display: block;
        }

        /* local video mirror effect */
        #localVideo {
            transform: scaleX(-1);
        }

        .call-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
            padding: 12px 20px;
            border-radius: 60px;
            color: white;
            margin-bottom: 8px;
        }

        #callStatus {
            font-weight: 600;
            font-size: 0.9rem;
            background: rgba(255,255,255,0.15);
            padding: 6px 14px;
            border-radius: 40px;
        }

        .control-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 12px 16px;
            background: rgba(20,20,20,0.9);
            backdrop-filter: blur(20px);
            border-radius: 80px;
            margin-top: 8px;
            margin-bottom: 10px;
        }

        .ctrl-btn {
            background: #2c2c2e;
            border: none;
            width: 56px;
            height: 56px;
            border-radius: 60px;
            font-size: 1.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .ctrl-btn.active {
            background: #00d4ff;
            color: #000;
        }

        .ctrl-btn.danger {
            background: #ff3b30;
        }

        .ctrl-btn:active {
            transform: scale(0.94);
        }

        /* auth card & friend list */
        .auth-card {
            background: #121212;
            border-radius: 40px;
            padding: 32px;
            text-align: center;
            border: 1px solid #262626;
        }

        .auth-card input {
            width: 100%;
            padding: 14px;
            background: #1f1f1f;
            border: none;
            border-radius: 60px;
            color: white;
            margin-bottom: 12px;
            font-size: 1rem;
        }

        .auth-card button {
            width: 100%;
            background: #00d4ff;
            border: none;
            padding: 14px;
            border-radius: 60px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }

        .friend-item {
            background: #121212;
            border-radius: 24px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #262626;
        }

        .call-btn {
            background: #00d4ff;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
        }

        .call-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .online {
            color: #22c55e;
        }

        .offline {
            color: #666;
        }

        .hidden {
            display: none !important;
        }

        .status {
            color: #888;
            font-size: 12px;
            margin-top: 5px;
        }

        input, button {
            font-family: inherit;
        }
    </style>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="container">
    <div id="loginDiv" class="auth-card">
        <h2 style="color:#00d4ff; margin-bottom: 24px;">📞 Chatrix</h2>
        <input type="text" id="loginName" placeholder="Username" autocomplete="off">
        <input type="password" id="loginPass" placeholder="Password (min 4 chars)">
        <button id="loginBtn">Login / Sign Up</button>
        <div id="loginError" class="status"></div>
    </div>

    <div id="appDiv" class="hidden">
        <h2 style="color:#00d4ff;">👥 Friends · Secure Call</h2>
        <div style="display: flex; gap: 10px; margin: 15px 0;">
            <input type="text" id="friendName" placeholder="Add friend username" style="flex:1; background:#1f1f1f; color:white; border:1px solid #333;">
            <button id="addFriendBtn" style="background:#00d4ff20; border:1px solid #00d4ff; color:#00d4ff; font-weight:bold;">+ Add</button>
        </div>
        <div id="friendsList"></div>
        <p style="color:#666; font-size:11px; text-align:center; margin-top:20px;">🔐 Secure WebRTC · TURN enabled · Screen share + mute controls</p>
    </div>
</div>

<div id="callOverlay" class="call-overlay hidden">
    <div class="call-header">
        <span id="callStatus">🔗 Connecting...</span>
        <button id="hangupBtn" style="background:#ff3b30; border:none; padding:8px 18px; border-radius:60px; color:white; font-weight:bold; font-size:0.9rem;">End Call</button>
    </div>
    
    <div class="videos-grid">
        <div class="video-wrapper">
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
        <div class="video-wrapper">
            <video id="localVideo" autoplay muted playsinline></video>
        </div>
    </div>
    
    <div class="control-bar">
        <button id="toggleMicBtn" class="ctrl-btn" title="Mute / Unmute">🎤</button>
        <button id="toggleVideoBtn" class="ctrl-btn" title="Disable / Enable Camera">📹</button>
        <button id="shareScreenBtn" class="ctrl-btn" title="Share Screen">🖥️</button>
    </div>
</div>

<script>
    // ======================== FIREBASE CONFIG ========================
    const firebaseConfig = {
        apiKey: "AIzaSyAW4j8PG_rzXIe8Lj8lLMnSSjZSUnLkhTk",
        authDomain: "tiktok-211df.firebaseapp.com",
        projectId: "tiktok-211df",
        storageBucket: "tiktok-211df.firebasestorage.app",
        messagingSenderId: "835878907951",
        appId: "1:835878907951:web:83e64a7d9e28d6706056da"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ========== TURN CREDENTIALS (METERED) ==========
    const TURN_CONFIG = {
        iceServers: [
            { urls: "stun:stun.relay.metered.ca:80" },
            {
                urls: "turn:global.relay.metered.ca:80",
                username: "80d7f1b46c263f4738b8ee87",
                credential: "rudw4iGDMIQLP/Y6",
            },
            {
                urls: "turn:global.relay.metered.ca:80?transport=tcp",
                username: "80d7f1b46c263f4738b8ee87",
                credential: "rudw4iGDMIQLP/Y6",
            },
            {
                urls: "turn:global.relay.metered.ca:443",
                username: "80d7f1b46c263f4738b8ee87",
                credential: "rudw4iGDMIQLP/Y6",
            },
            {
                urls: "turns:global.relay.metered.ca:443?transport=tcp",
                username: "80d7f1b46c263f4738b8ee87",
                credential: "rudw4iGDMIQLP/Y6",
            },
        ],
    };

    // ---------- GLOBAL STATE ----------
    let currentUser = null;
    let localStream = null;          // main camera/mic stream OR screen share stream
    let currentPeer = null;
    let currentCall = null;
    let heartbeatInterval = null;
    let isMicMuted = false;
    let isVideoMuted = false;
    let isScreenSharing = false;
    let originalStream = null;       // store original camera stream when screen sharing

    // DOM elements
    const loginDiv = document.getElementById('loginDiv');
    const appDiv = document.getElementById('appDiv');
    const callOverlay = document.getElementById('callOverlay');
    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const callStatusSpan = document.getElementById('callStatus');
    const toggleMicBtn = document.getElementById('toggleMicBtn');
    const toggleVideoBtn = document.getElementById('toggleVideoBtn');
    const shareScreenBtn = document.getElementById('shareScreenBtn');
    const hangupBtn = document.getElementById('hangupBtn');

    // ---------- HELPER: get camera/audio stream (default) ----------
    async function getCameraStream() {
        try {
            if (localStream) {
                // stop all tracks before replacing
                localStream.getTracks().forEach(track => {
                    if (track.readyState === 'live') track.stop();
                });
            }
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            return stream;
        } catch (err) {
            console.error("Camera error:", err);
            alert("Camera/Microphone access required for calls.");
            throw err;
        }
    }

    // apply local stream to video element and update peer connection if call active
    async function replaceLocalStream(newStream) {
        if (localStream) {
            // stop old tracks to free resources (except if we keep for resume, but safe to stop)
            const oldTracks = localStream.getTracks();
            oldTracks.forEach(t => {
                if (t.readyState === 'live' && t.kind !== newStream.getTrackByKind(t.kind)) {
                    t.stop();
                }
            });
        }
        localStream = newStream;
        localVideo.srcObject = localStream;
        
        // if there is an active call, replace the stream being sent
        if (currentCall && currentCall.peerConnection) {
            const senders = currentCall.peerConnection.getSenders();
            const audioTrack = localStream.getAudioTracks()[0];
            const videoTrack = localStream.getVideoTracks()[0];
            senders.forEach(sender => {
                if (sender.track && sender.track.kind === 'audio' && audioTrack) {
                    sender.replaceTrack(audioTrack);
                }
                if (sender.track && sender.track.kind === 'video' && videoTrack) {
                    sender.replaceTrack(videoTrack);
                }
            });
        }
        
        // reset mute/video buttons states based on current stream tracks
        const audioTrackExists = localStream.getAudioTracks()[0];
        const videoTrackExists = localStream.getVideoTracks()[0];
        if (audioTrackExists) {
            isMicMuted = !audioTrackExists.enabled;
            updateMicButtonUI();
        }
        if (videoTrackExists) {
            isVideoMuted = !videoTrackExists.enabled;
            updateVideoButtonUI();
        }
    }

    // toggle mic
    async function toggleMic() {
        if (!localStream) return;
        const audioTrack = localStream.getAudioTracks()[0];
        if (audioTrack) {
            audioTrack.enabled = !audioTrack.enabled;
            isMicMuted = !audioTrack.enabled;
            updateMicButtonUI();
        } else {
            alert("No audio track available");
        }
    }

    function updateMicButtonUI() {
        if (isMicMuted) {
            toggleMicBtn.style.background = "#ff3b30";
            toggleMicBtn.textContent = "🔇";
        } else {
            toggleMicBtn.style.background = "#2c2c2e";
            toggleMicBtn.textContent = "🎤";
        }
    }

    async function toggleVideo() {
        if (!localStream) return;
        const videoTrack = localStream.getVideoTracks()[0];
        if (videoTrack) {
            videoTrack.enabled = !videoTrack.enabled;
            isVideoMuted = !videoTrack.enabled;
            updateVideoButtonUI();
        } else {
            alert("No video track available (maybe screen share?) you can stop screen share to get camera back.");
        }
    }

    function updateVideoButtonUI() {
        if (isVideoMuted) {
            toggleVideoBtn.style.background = "#ff3b30";
            toggleVideoBtn.textContent = "🚫📹";
        } else {
            toggleVideoBtn.style.background = "#2c2c2e";
            toggleVideoBtn.textContent = "📹";
        }
    }

    // SCREEN SHARE LOGIC: replace video track with screen share, keep audio
    async function startScreenShare() {
        if (!localStream) {
            alert("No stream active");
            return;
        }
        if (isScreenSharing) {
            // stop screen share and revert to camera
            await stopScreenShare();
            return;
        }
        try {
            // get display media (screen share)
            const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
            // preserve original stream for later (camera + mic)
            if (!originalStream) {
                originalStream = await getCameraStream(); // clone original concept
                // but we need to keep original reference? we'll store tracks separately.
                // simpler: store current localStream as backup (camera + mic)
                if (localStream && !isScreenSharing) {
                    // store backup only once
                    if (!window._backupStream) {
                        window._backupStream = await getCameraStream();
                    }
                }
            }
            // get current audio tracks (preserve mic)
            const currentAudioTracks = localStream.getAudioTracks();
            const newStream = new MediaStream();
            // add audio from existing stream (mic) if any
            currentAudioTracks.forEach(track => {
                if (track.kind === 'audio') newStream.addTrack(track);
            });
            // add screen share video track
            const screenVideoTrack = screenStream.getVideoTracks()[0];
            newStream.addTrack(screenVideoTrack);
            
            // handle when user stops screen share via browser UI
            screenVideoTrack.onended = () => {
                if (isScreenSharing) stopScreenShare();
            };
            
            await replaceLocalStream(newStream);
            isScreenSharing = true;
            shareScreenBtn.style.background = "#00d4ff";
            shareScreenBtn.textContent = "🖥️✓";
            // video mute flag reset logically: we have video but we can still mute
            isVideoMuted = false;
            updateVideoButtonUI();
        } catch (err) {
            console.error("Screen share error:", err);
            alert("Could not start screen share. Permission denied or error.");
        }
    }

    async function stopScreenShare() {
        if (!isScreenSharing) return;
        try {
            // revert to original camera + mic stream
            let fallbackStream = null;
            if (window._backupStream) {
                fallbackStream = window._backupStream;
                // ensure tracks are still alive (some may have been stopped)
                const audioTracks = fallbackStream.getAudioTracks();
                const videoTracks = fallbackStream.getVideoTracks();
                if (videoTracks.length === 0 || videoTracks[0].readyState === 'ended') {
                    fallbackStream = await getCameraStream();
                } else {
                    // check if tracks are still enabled
                    videoTracks.forEach(t => { if(t.readyState === 'ended') t.stop(); });
                    if (fallbackStream.getVideoTracks().length === 0) fallbackStream = await getCameraStream();
                }
            } else {
                fallbackStream = await getCameraStream();
            }
            await replaceLocalStream(fallbackStream);
            isScreenSharing = false;
            shareScreenBtn.style.background = "#2c2c2e";
            shareScreenBtn.textContent = "🖥️";
            window._backupStream = null;
        } catch (err) {
            console.error("Stop screen share error:", err);
            // try hard reset
            const camStream = await getCameraStream();
            await replaceLocalStream(camStream);
            isScreenSharing = false;
            shareScreenBtn.style.background = "#2c2c2e";
            shareScreenBtn.textContent = "🖥️";
        }
    }

    // ---------- CALL MANAGEMENT ----------
    async function startCall(friendId) {
        callOverlay.classList.remove('hidden');
        callStatusSpan.innerText = "📞 Calling...";
        
        try {
            // acquire camera/mic stream if not existing or if stream missing video
            if (!localStream || localStream.getVideoTracks().length === 0) {
                const freshStream = await getCameraStream();
                await replaceLocalStream(freshStream);
                if (window._backupStream) window._backupStream = null;
                isScreenSharing = false;
                shareScreenBtn.style.background = "#2c2c2e";
                shareScreenBtn.textContent = "🖥️";
            }
            
            const friendDoc = await db.collection('peers').doc(friendId).get();
            if (!friendDoc.exists) {
                alert(`${friendId} is offline or not registered`);
                endCallUI();
                return;
            }
            const friendPeerId = friendDoc.data().peerId;
            const call = currentPeer.call(friendPeerId, localStream);
            currentCall = call;
            
            call.on('stream', (remoteStream) => {
                remoteVideo.srcObject = remoteStream;
                callStatusSpan.innerText = "🎥 Live call · secured";
            });
            
            call.on('close', () => {
                endCallUI();
            });
            
            call.on('error', (err) => {
                console.error("Call error:", err);
                alert("Call failed: network or user unavailable.");
                endCallUI();
            });
        } catch (err) {
            console.error(err);
            alert("Cannot start call. Check camera permissions.");
            endCallUI();
        }
    }
    
    function listenForCalls() {
        if (!currentPeer) return;
        currentPeer.on('call', async (call) => {
            callOverlay.classList.remove('hidden');
            callStatusSpan.innerText = "📞 Incoming call...";
            
            try {
                // get local media if not ready
                if (!localStream || localStream.getVideoTracks().length === 0) {
                    const freshStream = await getCameraStream();
                    await replaceLocalStream(freshStream);
                    isScreenSharing = false;
                    shareScreenBtn.style.background = "#2c2c2e";
                }
                call.answer(localStream);
                currentCall = call;
                
                call.on('stream', (remoteStream) => {
                    remoteVideo.srcObject = remoteStream;
                    callStatusSpan.innerText = "🎥 In call · live";
                });
                
                call.on('close', () => {
                    endCallUI();
                });
            } catch (err) {
                console.error("Answer error", err);
                alert("Could not answer call (camera/mic missing)");
                endCallUI();
            }
        });
    }
    
    function endCallUI() {
        callOverlay.classList.add('hidden');
        if (remoteVideo.srcObject) {
            remoteVideo.srcObject.getTracks().forEach(t => t.stop());
            remoteVideo.srcObject = null;
        }
        if (currentCall) {
            currentCall.close();
            currentCall = null;
        }
        // optional: keep local stream alive for next call, but not stop local camera (to keep preview)
        callStatusSpan.innerText = "";
        // reset screen sharing flag UI? but don't destroy media
        if (isScreenSharing) {
            // try to revert when call ends but not forced
        }
    }
    
    async function initPeer() {
        return new Promise((resolve) => {
            const peer = new Peer(null, { config: TURN_CONFIG });
            peer.on('open', (id) => {
                currentPeer = peer;
                listenForCalls();
                resolve(id);
            });
            peer.on('error', (err) => console.log("Peer error:", err));
        });
    }
    
    async function setStatus(userId, online) {
        await db.collection('presence').doc(userId).set({ online, lastSeen: new Date() }, { merge: true });
    }
    
    async function getStatus(userId) {
        const snap = await db.collection('presence').doc(userId).get();
        return snap.exists ? snap.data().online : false;
    }
    
    async function startHeartbeat() {
        if (heartbeatInterval) clearInterval(heartbeatInterval);
        await setStatus(currentUser, true);
        heartbeatInterval = setInterval(() => setStatus(currentUser, true), 15000);
        window.addEventListener('beforeunload', () => setStatus(currentUser, false));
    }
    
    async function sendFriendRequest(username) {
        if (username === currentUser) { alert("Can't add yourself"); return; }
        const userRef = db.collection('users').doc(currentUser);
        const doc = await userRef.get();
        const friends = doc.exists ? doc.data().friends || [] : [];
        if (friends.includes(username)) { alert("Already friends"); return; }
        await userRef.update({ friends: firebase.firestore.FieldValue.arrayUnion(username) });
        await db.collection('users').doc(username).update({ friends: firebase.firestore.FieldValue.arrayUnion(currentUser) });
        loadFriends();
    }
    
    async function loadFriends() {
        const doc = await db.collection('users').doc(currentUser).get();
        const friends = doc.exists ? doc.data().friends || [] : [];
        const container = document.getElementById('friendsList');
        if (!container) return;
        if (friends.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:#666; padding:30px;">✨ No friends yet. Add someone!</div>';
            return;
        }
        let html = '';
        for (const f of friends) {
            const online = await getStatus(f);
            html += `<div class="friend-item">
                <div><strong>${f}</strong> <span class="${online ? 'online' : 'offline'}">${online ? '● Online' : '○ Offline'}</span></div>
                <button class="call-btn" onclick="window.startCallExternal('${f}')" ${!online ? 'disabled' : ''}>📞 Call</button>
            </div>`;
        }
        container.innerHTML = html;
    }
    
    window.startCallExternal = (friendId) => startCall(friendId);
    
    async function initUser() {
        const ref = db.collection('users').doc(currentUser);
        if (!(await ref.get()).exists) {
            await ref.set({ username: currentUser, friends: [], createdAt: new Date() });
        }
        await loadFriends();
        setInterval(() => loadFriends(), 5000);
    }
    
    async function handleAuth() {
        const username = document.getElementById('loginName').value.trim().toLowerCase();
        const password = document.getElementById('loginPass').value;
        const errorDiv = document.getElementById('loginError');
        if (!username || password.length < 4) {
            errorDiv.innerText = 'Username and password (min 4 chars)';
            return;
        }
        const userRef = db.collection('users').doc(username);
        const doc = await userRef.get();
        if (!doc.exists) {
            await userRef.set({ username, friends: [], passwordHash: btoa(password), createdAt: new Date() });
            errorDiv.innerText = '✅ Account created!';
        } else if (doc.data().passwordHash !== btoa(password)) {
            errorDiv.innerText = '❌ Wrong password';
            return;
        }
        currentUser = username;
        const peerId = await initPeer();
        await db.collection('peers').doc(username).set({ peerId });
        await startHeartbeat();
        await initUser();
        // preload camera stream not yet for permissions but will request on first call
        // optional preload for smoothness
        try {
            const previewStream = await getCameraStream();
            await replaceLocalStream(previewStream);
            window._backupStream = null;
            isScreenSharing = false;
        } catch(e) { console.warn("preview not granted, will request later"); }
        
        loginDiv.style.display = 'none';
        appDiv.classList.remove('hidden');
        errorDiv.innerText = '';
    }
    
    // attach event listeners
    document.getElementById('loginBtn').onclick = handleAuth;
    document.getElementById('addFriendBtn').onclick = () => {
        const name = document.getElementById('friendName').value.trim().toLowerCase();
        if (name) sendFriendRequest(name);
    };
    hangupBtn.onclick = () => {
        if (currentCall) currentCall.close();
        endCallUI();
    };
    toggleMicBtn.onclick = toggleMic;
    toggleVideoBtn.onclick = toggleVideo;
    shareScreenBtn.onclick = startScreenShare;
    
    document.getElementById('loginName').addEventListener('keypress', e => { if (e.key === 'Enter') handleAuth(); });
    document.getElementById('loginPass').addEventListener('keypress', e => { if (e.key === 'Enter') handleAuth(); });
</script>
</body>
</html>
