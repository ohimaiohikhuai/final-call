<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Test - No Firebase</title>
    <style>
        body { background: #0a0a0a; color: white; font-family: monospace; padding: 20px; }
        video { width: 300px; margin: 10px; background: #000; border-radius: 12px; }
        button { background: #00d4ff; border: none; padding: 10px 20px; margin: 5px; border-radius: 20px; cursor: pointer; }
        input { padding: 10px; border-radius: 20px; border: none; margin: 5px; }
        .status { background: #1a1a1a; padding: 10px; border-radius: 12px; margin: 10px 0; font-family: monospace; }
        .green { color: #22c55e; }
        .red { color: #ff3b30; }
    </style>
</head>
<body>
    <h2>🔧 WebRTC Connection Test</h2>
    <div class="status" id="status">Ready</div>
    
    <div>
        <video id="localVideo" autoplay muted playsinline></video>
        <video id="remoteVideo" autoplay playsinline></video>
    </div>
    
    <div>
        <input type="text" id="roomName" placeholder="Room name" value="test123">
        <button id="createBtn">📞 Create Call (Host)</button>
        <button id="joinBtn">👥 Join Call</button>
    </div>

    <script>
        let localStream = null;
        let pc = null;
        let roomName = null;
        
        const statusDiv = document.getElementById('status');
        
        // Public STUN servers only
        const config = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' }
            ]
        };
        
        function log(msg, isError = false) {
            statusDiv.innerHTML += `<div class="${isError ? 'red' : 'green'}">${new Date().toLocaleTimeString()}: ${msg}</div>`;
            statusDiv.scrollTop = statusDiv.scrollHeight;
            console.log(msg);
        }
        
        async function getCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localStream = stream;
                document.getElementById('localVideo').srcObject = stream;
                log('✅ Camera & mic working');
                return true;
            } catch(e) {
                log('❌ Camera error: ' + e.message, true);
                return false;
            }
        }
        
        async function createCall() {
            roomName = document.getElementById('roomName').value.trim();
            if (!roomName) { alert('Enter room name'); return; }
            
            log('📞 Starting as HOST...');
            
            const ok = await getCamera();
            if (!ok) return;
            
            pc = new RTCPeerConnection(config);
            
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            
            pc.ontrack = (event) => {
                log('📡 Remote track received!');
                document.getElementById('remoteVideo').srcObject = event.streams[0];
            };
            
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    const candidateKey = roomName + '_candidate';
                    localStorage.setItem(candidateKey, JSON.stringify(event.candidate));
                    log('📤 ICE candidate saved');
                }
            };
            
            pc.oniceconnectionstatechange = () => {
                log(`🔌 ICE state: ${pc.iceConnectionState}`);
                if (pc.iceConnectionState === 'connected') {
                    log('🎉 CALL CONNECTED!');
                } else if (pc.iceConnectionState === 'failed') {
                    log('❌ Connection failed', true);
                }
            };
            
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            localStorage.setItem(roomName + '_offer', JSON.stringify(offer));
            log('📤 Offer created and saved');
            log('✅ Waiting for other person to JOIN...');
        }
        
        async function joinCall() {
            roomName = document.getElementById('roomName').value.trim();
            if (!roomName) { alert('Enter room name'); return; }
            
            log('👥 Joining as GUEST...');
            
            const offerData = localStorage.getItem(roomName + '_offer');
            if (!offerData) {
                log('❌ No offer found. Host must create call first!', true);
                return;
            }
            
            const ok = await getCamera();
            if (!ok) return;
            
            pc = new RTCPeerConnection(config);
            
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            
            pc.ontrack = (event) => {
                log('📡 Remote track received!');
                document.getElementById('remoteVideo').srcObject = event.streams[0];
            };
            
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    const candidateKey = roomName + '_candidate_guest';
                    localStorage.setItem(candidateKey, JSON.stringify(event.candidate));
                    log('📤 ICE candidate saved');
                }
            };
            
            pc.oniceconnectionstatechange = () => {
                log(`🔌 ICE state: ${pc.iceConnectionState}`);
                if (pc.iceConnectionState === 'connected') {
                    log('🎉 CALL CONNECTED!');
                } else if (pc.iceConnectionState === 'failed') {
                    log('❌ Connection failed', true);
                }
            };
            
            const offer = JSON.parse(offerData);
            await pc.setRemoteDescription(offer);
            log('📥 Remote description set');
            
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            localStorage.setItem(roomName + '_answer', JSON.stringify(answer));
            log('📤 Answer created');
            
            // Check for host's ICE candidates
            const checkCandidates = setInterval(() => {
                const candidateData = localStorage.getItem(roomName + '_candidate');
                if (candidateData && pc) {
                    const candidate = JSON.parse(candidateData);
                    pc.addIceCandidate(new RTCIceCandidate(candidate)).catch(e => log('ICE error: ' + e.message));
                    localStorage.removeItem(roomName + '_candidate');
                    log('📥 ICE candidate added from host');
                }
            }, 1000);
            
            setTimeout(() => clearInterval(checkCandidates), 30000);
        }
        
        document.getElementById('createBtn').onclick = createCall;
        document.getElementById('joinBtn').onclick = joinCall;
        
        log('🔧 Ready - TEST MODE (no Firebase)');
        log('📌 On Device 1: Click "Create Call"');
        log('📌 On Device 2: Click "Join Call" (SAME room name)');
    </script>
</body>
</html>
