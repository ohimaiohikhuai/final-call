<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Chatrix · Working Video Calls</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; font-family: system-ui, sans-serif; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        video { width: 100%; background: #000; border-radius: 16px; margin: 10px 0; transform: scaleX(-1); }
        .friend-item { background: #121212; border-radius: 24px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .call-btn { background: #00d4ff; border: none; padding: 8px 20px; border-radius: 30px; cursor: pointer; font-weight: bold; }
        input, button { padding: 10px; border-radius: 30px; border: none; margin: 5px; }
        .hidden { display: none; }
        .call-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; padding: 20px; }
        .call-header { display: flex; justify-content: space-between; margin-bottom: 20px; color: white; }
        .auth-card { background: #121212; border-radius: 40px; padding: 32px; text-align: center; border: 1px solid #262626; }
        .auth-card input { width: 100%; padding: 14px; background: #1f1f1f; border: none; border-radius: 60px; color: white; margin-bottom: 12px; }
        .auth-card button { width: 100%; background: #00d4ff; border: none; padding: 14px; border-radius: 60px; font-weight: bold; cursor: pointer; }
        .status { color: #888; font-size: 12px; margin-top: 5px; }
        .online { color: #22c55e; }
        .offline { color: #666; }
    </style>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="container">
    <div id="loginDiv" class="auth-card">
        <h2 style="color:#00d4ff;">📞 Chatrix</h2>
        <input type="text" id="loginName" placeholder="Username">
        <input type="password" id="loginPass" placeholder="Password (min 4 chars)">
        <button id="loginBtn">Login / Sign Up</button>
        <div id="loginError" class="status"></div>
    </div>

    <div id="appDiv" class="hidden">
        <h2 style="color:#00d4ff;">Friends</h2>
        <div style="display: flex; gap: 10px; margin: 15px 0;">
            <input type="text" id="friendName" placeholder="Add friend username" style="flex:1">
            <button id="addFriendBtn" style="background:#00d4ff20; border:1px solid #00d4ff; color:#00d4ff;">Add</button>
        </div>
        <div id="friendsList"></div>
        <p style="color:#666; font-size:11px; text-align:center; margin-top:20px;">🔐 Works across devices · TURN enabled</p>
    </div>
</div>

<div id="callOverlay" class="call-overlay hidden">
    <div class="call-header">
        <span id="callStatus">Connecting...</span>
        <button id="hangupBtn" style="background:#ff3b30; border:none; padding:10px 20px; border-radius:30px; color:white; font-weight:bold;">End Call</button>
    </div>
    <video id="localVideo" autoplay muted playsinline></video>
    <video id="remoteVideo" autoplay playsinline></video>
</div>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyAW4j8PG_rzXIe8Lj8lLMnSSjZSUnLkhTk",
        authDomain: "tiktok-211df.firebaseapp.com",
        projectId: "tiktok-211df",
        storageBucket: "tiktok-211df.firebasestorage.app",
        messagingSenderId: "835878907951",
        appId: "1:835878907951:web:83e64a7d9e28d6706056da"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ========== YOUR TURN CREDENTIALS FROM METERED ==========
    const TURN_CONFIG = {
        iceServers: [
            { urls: "stun:stun.relay.metered.ca:80" },
            {
                urls: "turn:global.relay.metered.ca:80",
                username: "80d7f1b46c263f4738b8ee87",
                credential: "rudw4iGDMIQLP/Y6",
            },
            {
                urls: "turn:global.relay.metered.ca:80?transport=tcp",
                username: "80d7f1b46c263f4738b8ee87",
                credential: "rudw4iGDMIQLP/Y6",
            },
            {
                urls: "turn:global.relay.metered.ca:443",
                username: "80d7f1b46c263f4738b8ee87",
                credential: "rudw4iGDMIQLP/Y6",
            },
            {
                urls: "turns:global.relay.metered.ca:443?transport=tcp",
                username: "80d7f1b46c263f4738b8ee87",
                credential: "rudw4iGDMIQLP/Y6",
            },
        ],
    };
    // ==========================================================

    let currentUser = null;
    let localStream = null;
    let currentPeer = null;
    let currentCall = null;
    let heartbeatInterval = null;

    async function getCamera() {
        try {
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('localVideo').srcObject = localStream;
            return true;
        } catch(e) { 
            alert("Camera/microphone access needed for calls");
            return false; 
        }
    }

    async function startCall(friendId) {
        const callDiv = document.getElementById('callOverlay');
        const callStatus = document.getElementById('callStatus');
        callDiv.classList.remove('hidden');
        callStatus.innerText = "📞 Calling...";
        
        const ok = await getCamera();
        if (!ok) return;
        
        const friendDoc = await db.collection('peers').doc(friendId).get();
        if (!friendDoc.exists) {
            alert(`${friendId} is offline`);
            callDiv.classList.add('hidden');
            return;
        }
        
        const friendPeerId = friendDoc.data().peerId;
        const call = currentPeer.call(friendPeerId, localStream);
        currentCall = call;
        
        call.on('stream', (remoteStream) => {
            document.getElementById('remoteVideo').srcObject = remoteStream;
            callStatus.innerText = "🎥 In call";
        });
        
        call.on('close', () => {
            callDiv.classList.add('hidden');
            document.getElementById('remoteVideo').srcObject = null;
        });
        
        call.on('error', (err) => {
            console.error("Call error:", err);
            alert("Call failed. Check if other user is online.");
            callDiv.classList.add('hidden');
        });
    }

    function listenForCalls() {
        if (!currentPeer) return;
        currentPeer.on('call', async (call) => {
            const callDiv = document.getElementById('callOverlay');
            const callStatus = document.getElementById('callStatus');
            callDiv.classList.remove('hidden');
            callStatus.innerText = "📞 Incoming call...";
            
            const ok = await getCamera();
            if (!ok) return;
            
            call.answer(localStream);
            currentCall = call;
            
            call.on('stream', (remoteStream) => {
                document.getElementById('remoteVideo').srcObject = remoteStream;
                callStatus.innerText = "🎥 In call";
            });
            
            call.on('close', () => {
                callDiv.classList.add('hidden');
                document.getElementById('remoteVideo').srcObject = null;
            });
        });
    }

    async function initPeer() {
        return new Promise((resolve) => {
            const peer = new Peer(null, { config: TURN_CONFIG });
            peer.on('open', (id) => {
                currentPeer = peer;
                listenForCalls();
                resolve(id);
            });
            peer.on('error', (err) => console.log("Peer error:", err));
        });
    }

    async function setStatus(userId, online) {
        await db.collection('presence').doc(userId).set({ online, lastSeen: new Date() }, { merge: true });
    }

    async function getStatus(userId) {
        const snap = await db.collection('presence').doc(userId).get();
        return snap.exists ? snap.data().online : false;
    }

    async function startHeartbeat() {
        if (heartbeatInterval) clearInterval(heartbeatInterval);
        await setStatus(currentUser, true);
        heartbeatInterval = setInterval(() => setStatus(currentUser, true), 15000);
        window.addEventListener('beforeunload', () => setStatus(currentUser, false));
    }

    async function sendFriendRequest(username) {
        if (username === currentUser) { alert("Can't add yourself"); return; }
        const userRef = db.collection('users').doc(currentUser);
        const doc = await userRef.get();
        const friends = doc.exists ? doc.data().friends || [] : [];
        if (friends.includes(username)) { alert("Already friends"); return; }
        await userRef.update({ friends: firebase.firestore.FieldValue.arrayUnion(username) });
        await db.collection('users').doc(username).update({ friends: firebase.firestore.FieldValue.arrayUnion(currentUser) });
        loadFriends();
    }

    async function loadFriends() {
        const doc = await db.collection('users').doc(currentUser).get();
        const friends = doc.exists ? doc.data().friends || [] : [];
        const container = document.getElementById('friendsList');
        if (!container) return;
        
        if (friends.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:#666; padding:30px;">No friends yet. Add someone!</div>';
            return;
        }
        
        let html = '';
        for (const f of friends) {
            const online = await getStatus(f);
            html += `<div class="friend-item">
                <div><strong>${f}</strong> <span class="${online ? 'online' : 'offline'}">${online ? '● Online' : '○ Offline'}</span></div>
                <button class="call-btn" onclick="startCall('${f}')" ${!online ? 'disabled' : ''}>📞 Call</button>
            </div>`;
        }
        container.innerHTML = html;
    }

    async function initUser() {
        const ref = db.collection('users').doc(currentUser);
        if (!(await ref.get()).exists) {
            await ref.set({ username: currentUser, friends: [], createdAt: new Date() });
        }
        await loadFriends();
        setInterval(() => loadFriends(), 5000);
    }

    async function handleAuth() {
        const username = document.getElementById('loginName').value.trim().toLowerCase();
        const password = document.getElementById('loginPass').value;
        const errorDiv = document.getElementById('loginError');
        
        if (!username || password.length < 4) {
            errorDiv.innerText = 'Username and password (min 4 chars)';
            return;
        }
        
        const userRef = db.collection('users').doc(username);
        const doc = await userRef.get();
        
        if (!doc.exists) {
            await userRef.set({ username, friends: [], passwordHash: btoa(password), createdAt: new Date() });
            errorDiv.innerText = '✅ Account created!';
        } else if (doc.data().passwordHash !== btoa(password)) {
            errorDiv.innerText = '❌ Wrong password';
            return;
        }
        
        currentUser = username;
        
        const peerId = await initPeer();
        await db.collection('peers').doc(username).set({ peerId });
        
        await startHeartbeat();
        await initUser();
        
        for (const u of ['Alice', 'Bob', 'Charlie']) {
            if (u !== username) await setStatus(u, true);
        }
        
        document.getElementById('loginDiv').style.display = 'none';
        document.getElementById('appDiv').classList.remove('hidden');
        errorDiv.innerText = '';
    }

    document.getElementById('loginBtn').onclick = handleAuth;
    document.getElementById('addFriendBtn').onclick = () => {
        const name = document.getElementById('friendName').value.trim().toLowerCase();
        if (name) sendFriendRequest(name);
    };
    document.getElementById('hangupBtn').onclick = () => {
        if (currentCall) currentCall.close();
        document.getElementById('callOverlay').classList.add('hidden');
        document.getElementById('remoteVideo').srcObject = null;
    };
    
    document.getElementById('loginName').addEventListener('keypress', e => { if (e.key === 'Enter') handleAuth(); });
    document.getElementById('loginPass').addEventListener('keypress', e => { if (e.key === 'Enter') handleAuth(); });
</script>
</body>
</html>
