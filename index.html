<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Chatrix Cloud | Friend System & Online Status</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .phone {
            width: 380px;
            height: 700px;
            background: #0f0f1a;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        .status-bar {
            background: #0f0f1a;
            padding: 12px 20px 6px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
            border-bottom: 1px solid #1f1f2e;
        }

        .tabs {
            display: flex;
            background: #0f0f1a;
            border-top: 1px solid #1f1f2e;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            color: #6c6c7a;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 12px;
        }
        .tab i { font-size: 20px; display: block; margin-bottom: 3px; }
        .tab.active { color: #00d4ff; background: #1a1a2e; border-top: 2px solid #00d4ff; }
        .tab-badge {
            background: #ff3b30;
            color: white;
            border-radius: 10px;
            padding: 2px 5px;
            font-size: 9px;
            margin-left: 5px;
        }

        .screen {
            height: calc(100% - 50px);
            overflow-y: auto;
            display: none;
            padding: 15px;
            padding-bottom: 60px;
        }
        .screen.active { display: block; }

        .card {
            background: #16162a;
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #252540;
        }
        .card:hover { background: #1e1e35; }
        .card-header { display: flex; align-items: center; gap: 12px; }
        .avatar {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #00d4ff, #0088ff);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            position: relative;
        }
        .online-indicator {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            background: #2ecc71;
            border-radius: 50%;
            border: 2px solid #16162a;
        }
        .offline-indicator {
            background: #7f8c8d;
        }
        .info { flex: 1; }
        .name { color: white; font-weight: 600; margin-bottom: 4px; }
        .preview { color: #8a8aa3; font-size: 12px; }
        .badge {
            background: #ff3b30;
            color: white;
            border-radius: 12px;
            padding: 2px 8px;
            font-size: 11px;
        }
        .header {
            background: #16162a;
            border-radius: 20px;
            padding: 12px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(135deg, #00d4ff, #0088ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        button {
            background: rgba(0, 212, 255, 0.2);
            border: 1px solid #00d4ff;
            color: #00d4ff;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
        }
        button:hover { background: rgba(0, 212, 255, 0.4); }
        .add-btn {
            background: #00d4ff;
            color: #0f0f1a;
            width: 100%;
            margin-bottom: 12px;
            font-weight: bold;
            border: none;
        }
        .add-btn:hover { background: #00e4ff; }
        .request-card {
            background: #1e1e35;
            border-left: 3px solid #00d4ff;
        }
        .request-actions { display: flex; gap: 8px; margin-top: 8px; }
        .accept-btn { background: #2ecc71; color: white; border: none; }
        .reject-btn { background: #e74c3c; color: white; border: none; }
        
        .chat-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f0f1a;
            z-index: 20;
            transform: translateX(100%);
            transition: 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .chat-view.open { transform: translateX(0); }
        .chat-header {
            background: #16162a;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #252540;
        }
        .back-btn { cursor: pointer; color: #00d4ff; font-size: 20px; }
        .chat-avatar { width: 40px; height: 40px; border-radius: 50%; background: #00d4ff; display: flex; align-items: center; justify-content: center; }
        .chat-name { color: white; font-weight: bold; flex: 1; }
        .chat-online-status { font-size: 11px; color: #2ecc71; }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .message {
            max-width: 80%;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
        }
        .message.sent { background: #00d4ff; color: #0f0f1a; align-self: flex-end; }
        .message.received { background: #1e1e35; color: white; align-self: flex-start; }
        .chat-input-area {
            display: flex;
            padding: 12px;
            gap: 8px;
            background: #16162a;
            border-top: 1px solid #252540;
        }
        .chat-input-area input {
            flex: 1;
            background: #252540;
            border: none;
            border-radius: 25px;
            padding: 10px 15px;
            color: white;
            outline: none;
        }
        .chat-input-area button { background: #00d4ff; color: #0f0f1a; border: none; }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-card {
            background: #16162a;
            border-radius: 28px;
            padding: 24px;
            width: 85%;
            border: 1px solid #00d4ff;
        }
        .modal-card h3, .modal-card h2 { color: white; margin-bottom: 16px; }
        .modal-card input { width: 100%; padding: 12px; margin: 8px 0; background: #252540; border: none; border-radius: 30px; color: white; outline: none; }
        .modal-card button { margin-top: 12px; width: 100%; }
        .hidden { display: none; }
        .empty { text-align: center; color: #6c6c7a; padding: 40px; }
        .typing { font-size: 11px; color: #00d4ff; margin-top: 4px; font-style: italic; }
        .section-title { color: #00d4ff; font-size: 14px; margin: 16px 0 8px 0; font-weight: bold; }
    </style>
</head>
<body>
<div class="phone">
    <div class="status-bar">
        <span>9:41</span>
        <span><i class="fas fa-signal"></i> <i class="fas fa-battery-full"></i></span>
    </div>

    <div class="tabs">
        <div class="tab active" data-tab="chats"><i class="fas fa-comment"></i><span>Chats</span><span id="chatsBadge" class="tab-badge hidden">0</span></div>
        <div class="tab" data-tab="groups"><i class="fas fa-users"></i><span>Groups</span></div>
        <div class="tab" data-tab="profile"><i class="fas fa-user"></i><span>Profile</span></div>
    </div>

    <!-- Chats Screen -->
    <div id="chatsScreen" class="screen active">
        <div class="header">
            <div class="logo"><i class="fas fa-cloud"></i> Chatrix Cloud</div>
            <button id="refreshBtn"><i class="fas fa-sync-alt"></i></button>
        </div>
        <button class="add-btn" id="addFriendBtn"><i class="fas fa-user-plus"></i> Add Friend</button>
        
        <div id="pendingRequestsSection"></div>
        <div class="section-title"><i class="fas fa-users"></i> Your Friends</div>
        <div id="friendsList"></div>
    </div>

    <!-- Groups Screen -->
    <div id="groupsScreen" class="screen">
        <div class="header"><div class="logo"><i class="fas fa-users"></i> Groups</div></div>
        <button class="add-btn" id="createGroupBtn"><i class="fas fa-plus"></i> Create Group</button>
        <div id="groupsList"><div class="empty">No groups yet. Create one!</div></div>
    </div>

    <!-- Profile Screen -->
    <div id="profileScreen" class="screen">
        <div class="header"><div class="logo"><i class="fas fa-user-circle"></i> Profile</div></div>
        <div class="card" id="profileCard">
            <div class="card-header">
                <div class="avatar" id="profileAvatar">👤</div>
                <div class="info"><div class="name" id="profileName">Loading...</div><div class="preview">Your username</div></div>
            </div>
        </div>
        <button id="logoutBtn" style="background:#ff3b3020; border-color:#ff3b30; color:#ff3b30; width:100%; margin-top:12px;"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>

    <!-- Chat View -->
    <div id="chatView" class="chat-view">
        <div class="chat-header">
            <div class="back-btn" id="closeChatBtn"><i class="fas fa-arrow-left"></i></div>
            <div class="chat-avatar" id="chatAvatar">👤</div>
            <div class="chat-name" id="chatName">User</div>
            <div class="chat-online-status" id="chatOnlineStatus"><i class="fas fa-circle" style="font-size: 8px;"></i> offline</div>
        </div>
        <div id="chatMessages" class="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="messageInput" placeholder="Type a message...">
            <button id="sendMsgBtn"><i class="fas fa-paper-plane"></i></button>
        </div>
        <div id="typingIndicator" class="typing" style="padding-left: 16px; display: none;">someone is typing...</div>
    </div>

    <!-- Modals -->
    <div id="addFriendModal" class="modal hidden">
        <div class="modal-card">
            <h3><i class="fas fa-user-plus"></i> Add Friend</h3>
            <input id="friendUsername" placeholder="Enter username">
            <button id="sendRequestBtn">Send Friend Request</button>
            <button id="closeAddFriendModal" style="background:#333;">Cancel</button>
        </div>
    </div>
    <div id="createGroupModal" class="modal hidden">
        <div class="modal-card">
            <h3>Create Group</h3>
            <input id="groupName" placeholder="Group Name">
            <button id="createGroupSubmit">Create</button>
            <button id="closeGroupModal" style="background:#333;">Cancel</button>
        </div>
    </div>
    <div id="loginModal" class="modal">
        <div class="modal-card">
            <h2>✨ Chatrix</h2>
            <input id="loginUser" placeholder="Username">
            <input id="loginPass" type="password" placeholder="Password">
            <button id="loginBtn">Login</button>
            <button id="showSignupBtn" style="background:#333;">Sign Up</button>
        </div>
    </div>
    <div id="signupModal" class="modal hidden">
        <div class="modal-card">
            <h2>Create Account</h2>
            <input id="signupUser" placeholder="Username">
            <input id="signupPass" type="password" placeholder="Password (min 6 chars)">
            <button id="signupBtn">Sign Up</button>
            <button id="showLoginBtn" style="background:#333;">Back to Login</button>
        </div>
    </div>
</div>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyAGftHy2cSWCz_h5nKQF-BChy885CYA9f4",
        authDomain: "chatrix-77180.firebaseapp.com",
        projectId: "chatrix-77180",
        storageBucket: "chatrix-77180.firebasestorage.app",
        messagingSenderId: "258648778331",
        appId: "1:258648778331:web:294dd149ce2baf32e9c17e"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let currentUser = null;
    let currentChatId = null;
    let currentChatType = 'friend';
    let friendsUnsubscribe = null;
    let requestsUnsubscribe = null;
    let typingTimeout = null;
    let presenceUnsubscribes = {};

    // Helper Functions
    function showScreen(screen) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(`${screen}Screen`).classList.add('active');
        document.querySelectorAll('.tab').forEach(tab => {
            tab.classList.remove('active');
            if(tab.getAttribute('data-tab') === screen) tab.classList.add('active');
        });
    }
    window.showScreen = showScreen;

    function escapeHtml(str) { 
        if (!str) return '';
        return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); 
    }

    // Online Presence System
    async function setUserOnline(userId, isOnline) {
        if (!userId) return;
        await db.collection('presence').doc(userId).set({
            online: isOnline,
            lastSeen: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });
    }

    function subscribeToPresence(userId, callback) {
        if (presenceUnsubscribes[userId]) presenceUnsubscribes[userId]();
        const unsub = db.collection('presence').doc(userId).onSnapshot(doc => {
            const data = doc.data();
            callback(data ? data.online : false);
        });
        presenceUnsubscribes[userId] = unsub;
        return unsub;
    }

    // Authentication
    async function login() {
        const username = document.getElementById('loginUser').value.trim().toLowerCase();
        const password = document.getElementById('loginPass').value;
        if (!username || !password) return alert("Please enter username and password");
        try {
            const email = `${username}@chatrix.local`;
            await auth.signInWithEmailAndPassword(email, password);
        } catch(e) { 
            alert("Invalid credentials. Please sign up first."); 
        }
    }

    async function signup() {
        const username = document.getElementById('signupUser').value.trim().toLowerCase();
        const password = document.getElementById('signupPass').value;
        if (!username || password.length < 6) return alert("Username and password (min 6 chars) required");
        try {
            const email = `${username}@chatrix.local`;
            await auth.createUserWithEmailAndPassword(email, password);
            // Create user document
            await db.collection('users').doc(username).set({
                username: username,
                displayName: username,
                friends: [],
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert("Account created! Please login.");
            document.getElementById('signupModal').classList.add('hidden');
            document.getElementById('loginModal').classList.remove('hidden');
        } catch(e) { 
            alert(e.message); 
        }
    }

    // Friend System - Render Friends with Online Status
    async function renderFriends() {
        if (!currentUser) return;
        
        const friendsList = currentUser.friends || [];
        const container = document.getElementById('friendsList');
        
        if (friendsList.length === 0) {
            container.innerHTML = '<div class="empty"><i class="fas fa-user-friends"></i> No friends yet. Add some!</div>';
            return;
        }
        
        let html = '';
        for (const friendId of friendsList) {
            // Get friend's user data
            const friendDoc = await db.collection('users').doc(friendId).get();
            const displayName = friendDoc.exists ? friendDoc.data().displayName : friendId;
            
            // Get online status
            const presenceSnap = await db.collection('presence').doc(friendId).get();
            const isOnline = presenceSnap.exists ? presenceSnap.data().online : false;
            
            html += `
                <div class="card" onclick="openChat('${escapeHtml(friendId)}', 'friend')">
                    <div class="card-header">
                        <div class="avatar">
                            👤
                            <span class="online-indicator ${!isOnline ? 'offline-indicator' : ''}" style="${!isOnline ? 'background:#7f8c8d;' : ''}"></span>
                        </div>
                        <div class="info">
                            <div class="name">${escapeHtml(displayName)} ${isOnline ? '<span style="color:#2ecc71; font-size:10px;">● Online</span>' : '<span style="color:#7f8c8d; font-size:10px;">● Offline</span>'}</div>
                            <div class="preview">@${escapeHtml(friendId)}</div>
                        </div>
                    </div>
                </div>
            `;
        }
        container.innerHTML = html;
    }

    // Render Pending Friend Requests
    async function renderPendingRequests() {
        if (!currentUser) return;
        
        const requestsSnap = await db.collection('friendRequests')
            .where('to', '==', currentUser.username)
            .where('status', '==', 'pending')
            .get();
        
        const container = document.getElementById('pendingRequestsSection');
        
        if (requestsSnap.empty) {
            container.innerHTML = '';
            return;
        }
        
        let html = '<div class="section-title"><i class="fas fa-envelope"></i> Friend Requests</div>';
        
        for (const doc of requestsSnap.docs) {
            const req = doc.data();
            const fromUser = req.from;
            const fromDoc = await db.collection('users').doc(fromUser).get();
            const displayName = fromDoc.exists ? fromDoc.data().displayName : fromUser;
            
            html += `
                <div class="card request-card">
                    <div class="card-header">
                        <div class="avatar">👤</div>
                        <div class="info">
                            <div class="name">${escapeHtml(displayName)}</div>
                            <div class="preview">@${escapeHtml(fromUser)} wants to be friends</div>
                        </div>
                    </div>
                    <div class="request-actions">
                        <button class="accept-btn" onclick="acceptRequest('${escapeHtml(fromUser)}')"><i class="fas fa-check"></i> Accept</button>
                        <button class="reject-btn" onclick="rejectRequest('${escapeHtml(fromUser)}')"><i class="fas fa-times"></i> Decline</button>
                    </div>
                </div>
            `;
        }
        container.innerHTML = html;
    }

    // Send Friend Request
    async function sendFriendRequest() {
        const targetUsername = document.getElementById('friendUsername').value.trim().toLowerCase();
        
        if (!targetUsername) {
            alert("Please enter a username");
            return;
        }
        
        if (targetUsername === currentUser.username) {
            alert("You cannot add yourself as a friend");
            return;
        }
        
        // Check if user exists
        const targetUser = await db.collection('users').doc(targetUsername).get();
        if (!targetUser.exists) {
            alert("User not found");
            return;
        }
        
        // Check if already friends
        if (currentUser.friends && currentUser.friends.includes(targetUsername)) {
            alert("You are already friends with this user");
            return;
        }
        
        // Check if request already sent
        const existingRequest = await db.collection('friendRequests')
            .where('from', '==', currentUser.username)
            .where('to', '==', targetUsername)
            .where('status', '==', 'pending')
            .get();
        
        if (!existingRequest.empty) {
            alert("Friend request already sent");
            return;
        }
        
        // Check for incoming pending request
        const incomingRequest = await db.collection('friendRequests')
            .where('from', '==', targetUsername)
            .where('to', '==', currentUser.username)
            .where('status', '==', 'pending')
            .get();
        
        if (!incomingRequest.empty) {
            alert("This user already sent you a request. Accept it instead.");
            return;
        }
        
        try {
            await db.collection('friendRequests').add({
                from: currentUser.username,
                to: targetUsername,
                status: 'pending',
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert(`Friend request sent to ${targetUsername}!`);
            document.getElementById('friendUsername').value = '';
            closeModal('addFriendModal');
        } catch (error) {
            console.error("Error sending request:", error);
            alert("Failed to send friend request");
        }
    }

    // Accept Friend Request
    window.acceptRequest = async function(fromUser) {
        try {
            // Update the request status
            const requestsSnap = await db.collection('friendRequests')
                .where('from', '==', fromUser)
                .where('to', '==', currentUser.username)
                .where('status', '==', 'pending')
                .get();
            
            if (requestsSnap.empty) {
                alert("Request not found");
                return;
            }
            
            const requestDoc = requestsSnap.docs[0];
            await requestDoc.ref.update({ status: 'accepted' });
            
            // Add to each other's friends list
            await db.collection('users').doc(currentUser.username).update({
                friends: firebase.firestore.FieldValue.arrayUnion(fromUser)
            });
            
            await db.collection('users').doc(fromUser).update({
                friends: firebase.firestore.FieldValue.arrayUnion(currentUser.username)
            });
            
            // Refresh current user data
            const updatedUser = await db.collection('users').doc(currentUser.username).get();
            currentUser = { username: currentUser.username, ...updatedUser.data() };
            
            await renderFriends();
            await renderPendingRequests();
            
            alert(`You are now friends with ${fromUser}!`);
        } catch (error) {
            console.error("Error accepting request:", error);
            alert("Failed to accept friend request");
        }
    };

    // Reject Friend Request
    window.rejectRequest = async function(fromUser) {
        try {
            const requestsSnap = await db.collection('friendRequests')
                .where('from', '==', fromUser)
                .where('to', '==', currentUser.username)
                .where('status', '==', 'pending')
                .get();
            
            if (!requestsSnap.empty) {
                await requestsSnap.docs[0].ref.delete();
            }
            
            await renderPendingRequests();
            alert(`Friend request from ${fromUser} declined`);
        } catch (error) {
            console.error("Error rejecting request:", error);
            alert("Failed to decline request");
        }
    };

    // Chat Functions
    async function openChat(chatId, type) {
        currentChatId = chatId;
        currentChatType = type;
        
        const chatView = document.getElementById('chatView');
        chatView.classList.add('open');
        
        // Get friend's display name
        const friendDoc = await db.collection('users').doc(chatId).get();
        const displayName = friendDoc.exists ? friendDoc.data().displayName : chatId;
        document.getElementById('chatName').innerText = displayName;
        
        // Subscribe to online status
        subscribeToPresence(chatId, (online) => {
            const statusSpan = document.getElementById('chatOnlineStatus');
            if (statusSpan) {
                statusSpan.innerHTML = online ? '<i class="fas fa-circle" style="color:#2ecc71; font-size:8px;"></i> online' : '<i class="fas fa-circle" style="color:#7f8c8d; font-size:8px;"></i> offline';
            }
        });
        
        // Load messages
        const chatDocId = [currentUser.username, chatId].sort().join('_');
        const messagesRef = db.collection('messages').doc(chatDocId).collection('chat').orderBy('timestamp');
        
        if (window.messagesUnsubscribe) window.messagesUnsubscribe();
        window.messagesUnsubscribe = messagesRef.onSnapshot(snapshot => {
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';
            snapshot.forEach(doc => {
                const msg = doc.data();
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${msg.from === currentUser.username ? 'sent' : 'received'}`;
                messageDiv.innerText = msg.text;
                container.appendChild(messageDiv);
            });
            container.scrollTop = container.scrollHeight;
            
            // Mark messages as read
            if (chatId !== currentUser.username) {
                markMessagesAsRead(chatId);
            }
        });
        
        // Typing listener
        const typingRef = db.collection('typing').doc(chatDocId);
        if (window.typingUnsubscribe) window.typingUnsubscribe();
        window.typingUnsubscribe = typingRef.onSnapshot(doc => {
            const data = doc.data();
            const typingDiv = document.getElementById('typingIndicator');
            if (data && data.user !== currentUser.username && data.isTyping) {
                typingDiv.style.display = 'block';
                typingDiv.innerText = `${displayName} is typing...`;
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => typingDiv.style.display = 'none', 2000);
            } else {
                typingDiv.style.display = 'none';
            }
        });
    }
    
    async function markMessagesAsRead(otherUser) {
        const chatDocId = [currentUser.username, otherUser].sort().join('_');
        const unreadMessages = await db.collection('messages').doc(chatDocId).collection('chat')
            .where('from', '==', otherUser)
            .where('read', '==', false)
            .get();
        
        unreadMessages.forEach(doc => {
            doc.ref.update({ read: true });
        });
    }
    
    async function sendMessage() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text || !currentChatId) return;
        
        const chatDocId = [currentUser.username, currentChatId].sort().join('_');
        
        await db.collection('messages').doc(chatDocId).collection('chat').add({
            from: currentUser.username,
            text: text,
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            read: false
        });
        
        // Stop typing indicator
        await db.collection('typing').doc(chatDocId).delete();
        
        input.value = '';
    }
    
    async function sendTypingIndicator(isTyping) {
        if (!currentChatId) return;
        const chatDocId = [currentUser.username, currentChatId].sort().join('_');
        
        if (isTyping) {
            await db.collection('typing').doc(chatDocId).set({
                user: currentUser.username,
                isTyping: true,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            setTimeout(async () => {
                await db.collection('typing').doc(chatDocId).delete();
            }, 2000);
        }
    }
    
    function closeChat() {
        document.getElementById('chatView').classList.remove('open');
        if (window.messagesUnsubscribe) window.messagesUnsubscribe();
        if (window.typingUnsubscribe) window.typingUnsubscribe();
        currentChatId = null;
    }
    
    function closeModal(id) { 
        document.getElementById(id).classList.add('hidden'); 
    }
    
    // Groups (simplified)
    function renderGroups() {
        const container = document.getElementById('groupsList');
        container.innerHTML = '<div class="empty"><i class="fas fa-users"></i> Groups feature coming soon!</div>';
    }
    
    // Load all user data
    async function loadUserData(user) {
        const email = user.email;
        const username = email.replace('@chatrix.local', '');
        
        const userDoc = await db.collection('users').doc(username).get();
        if (userDoc.exists) {
            currentUser = { username: username, ...userDoc.data() };
        } else {
            currentUser = { username: username, displayName: username, friends: [] };
        }
        
        document.getElementById('profileName').innerText = currentUser.displayName || currentUser.username;
        
        await renderFriends();
        await renderPendingRequests();
        renderGroups();
        
        // Set user as online
        await setUserOnline(username, true);
    }
    
    // Refresh everything
    async function refreshData() {
        if (currentUser) {
            await renderFriends();
            await renderPendingRequests();
        }
    }
    
    // Event Listeners
    document.getElementById('sendMsgBtn').onclick = sendMessage;
    document.getElementById('messageInput').addEventListener('input', (e) => {
        sendTypingIndicator(true);
    });
    document.getElementById('closeChatBtn').onclick = closeChat;
    document.getElementById('addFriendBtn').onclick = () => document.getElementById('addFriendModal').classList.remove('hidden');
    document.getElementById('sendRequestBtn').onclick = sendFriendRequest;
    document.getElementById('closeAddFriendModal').onclick = () => closeModal('addFriendModal');
    document.getElementById('refreshBtn').onclick = refreshData;
    
    document.getElementById('loginBtn').onclick = login;
    document.getElementById('signupBtn').onclick = signup;
    document.getElementById('showSignupBtn').onclick = () => {
        document.getElementById('loginModal').classList.add('hidden');
        document.getElementById('signupModal').classList.remove('hidden');
    };
    document.getElementById('showLoginBtn').onclick = () => {
        document.getElementById('signupModal').classList.add('hidden');
        document.getElementById('loginModal').classList.remove('hidden');
    };
    
    document.getElementById('createGroupBtn').onclick = () => alert("Groups feature coming soon!");
    document.getElementById('closeGroupModal').onclick = () => closeModal('createGroupModal');
    
    document.getElementById('logoutBtn').onclick = async () => {
        if (currentUser) await setUserOnline(currentUser.username, false);
        auth.signOut();
        location.reload();
    };
    
    // Window unload
    window.addEventListener('beforeunload', () => {
        if (currentUser) setUserOnline(currentUser.username, false);
    });
    
    // Auth state listener
    auth.onAuthStateChanged(async (user) => {
        if (user) {
            document.getElementById('loginModal').classList.add('hidden');
            await loadUserData(user);
            showScreen('chats');
            
            // Set interval to keep presence alive
            setInterval(() => {
                if (currentUser) setUserOnline(currentUser.username, true);
            }, 30000);
        } else {
            document.getElementById('loginModal').classList.remove('hidden');
            document.getElementById('signupModal').classList.add('hidden');
        }
    });
    
    // Make functions global for onclick handlers
    window.openChat = openChat;
    window.acceptRequest = acceptRequest;
    window.rejectRequest = rejectRequest;
    window.closeModal = closeModal;
</script>
</body>
</html>
