<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Chatrix · Complete Video Calls</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; font-family: system-ui, sans-serif; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        .auth-card { background: #121212; border-radius: 40px; padding: 32px; text-align: center; border: 1px solid #262626; }
        .auth-card h2 { color: #00d4ff; margin-bottom: 20px; }
        .auth-card input { width: 100%; padding: 14px; background: #1f1f1f; border: none; border-radius: 60px; color: white; margin-bottom: 12px; font-size: 16px; }
        .auth-card button { width: 100%; background: #00d4ff; border: none; padding: 14px; border-radius: 60px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .error-msg { color: #ff8080; font-size: 13px; margin-top: 12px; }
        
        .friend-item { background: #121212; border-radius: 24px; padding: 14px 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 14px; border: 1px solid #242424; }
        .avatar { width: 52px; height: 52px; background: #1e2a2e; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; position: relative; }
        .online-dot { position: absolute; bottom: 2px; right: 2px; width: 14px; background: #22c55e; border-radius: 50%; border: 2px solid #121212; }
        .offline-dot { background: #5f6c6f; }
        .friend-info { flex: 1; }
        .friend-name { color: white; font-weight: 600; font-size: 17px; }
        .status-text { color: #888; font-size: 12px; margin-top: 4px; }
        .call-btn { background: rgba(0,212,255,0.1); border: 1px solid #00d4ff; color: #00d4ff; padding: 8px 14px; border-radius: 40px; font-size: 14px; cursor: pointer; margin-left: 8px; }
        .call-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        
        .call-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; display: flex; flex-direction: column; }
        .call-header { background: #1a1a1a; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .call-controls { display: flex; gap: 10px; flex-wrap: wrap; }
        .call-controls button { background: #2c2c2e; border: none; color: white; padding: 8px 14px; border-radius: 30px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .call-controls button.active { background: #00d4ff; color: black; }
        .call-controls button.end-call { background: #ff3b30; }
        .video-grid { flex: 1; display: flex; gap: 10px; padding: 20px; background: #0a0a0a; }
        .video-container { flex: 1; background: #1a1a1a; border-radius: 16px; overflow: hidden; display: flex; align-items: center; justify-content: center; aspect-ratio: 16/9; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .chat-panel { width: 280px; background: #121212; border-left: 1px solid #333; display: flex; flex-direction: column; padding: 12px; }
        .chat-messages { flex: 1; overflow-y: auto; font-size: 13px; color: #ccc; margin-bottom: 12px; }
        .chat-messages div { margin-bottom: 8px; word-break: break-word; }
        .chat-input { display: flex; gap: 8px; }
        .chat-input input { flex: 1; padding: 8px; background: #2c2c2e; border: none; border-radius: 20px; color: white; }
        .chat-input button { background: #00d4ff; border: none; padding: 8px 12px; border-radius: 20px; cursor: pointer; }
        
        .incoming-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #121212; border-radius: 40px; padding: 32px; text-align: center; z-index: 2000; border: 2px solid #00d4ff; min-width: 280px; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.05); } 100% { transform: translate(-50%, -50%) scale(1); } }
        .incoming-modal button { padding: 10px 20px; border-radius: 40px; font-weight: bold; margin: 0 10px; cursor: pointer; }
        .accept { background: #22c55e; border: none; color: white; }
        .decline { background: #ff3b30; border: none; color: white; }
        
        .header { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .header h2 { color: #00d4ff; }
        .logout-btn { background: #2c2c2e; border: none; color: #aaa; padding: 8px 16px; border-radius: 40px; cursor: pointer; }
        .add-friend-section { margin-bottom: 16px; display: flex; gap: 10px; }
        .add-friend-section input { flex: 1; padding: 12px; background: #1f1f1f; border: none; border-radius: 60px; color: white; }
        .add-friend-section button { background: rgba(0,212,255,0.1); border: 1px solid #00d4ff; color: #00d4ff; padding: 0 20px; border-radius: 60px; cursor: pointer; }
        .group-section { display: flex; gap: 10px; margin-top: 16px; }
        .group-section input { flex: 1; padding: 12px; background: #1f1f1f; border: none; border-radius: 60px; color: white; }
        .group-section button { background: rgba(0,212,255,0.1); border: 1px solid #00d4ff; color: #00d4ff; padding: 0 20px; border-radius: 60px; cursor: pointer; }
        
        .toast { position: fixed; bottom: 100px; left: 20px; right: 20px; background: #1e2a2e; border-left: 4px solid #00d4ff; padding: 14px; border-radius: 16px; z-index: 2000; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .hidden { display: none; }
        .status-online { color: #22c55e; font-size: 12px; }
        .status-offline { color: #666; font-size: 12px; }
    </style>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/js/all.min.js"></script>
</head>
<body>
<div class="container">
    <div id="authSection" class="auth-card">
        <h2><i class="fas fa-video"></i> Chatrix</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password (min 4 chars)">
        <button id="loginBtn">Login / Sign Up</button>
        <div id="authError" class="error-msg"></div>
        <p style="color:#888; font-size:12px; margin-top:16px;">🔐 Works across devices · Group calls · Screen share</p>
    </div>

    <div id="appSection" class="hidden">
        <div class="header">
            <h2><i class="fas fa-comment"></i> Friends</h2>
            <button id="logoutBtn" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
        <div class="add-friend-section">
            <input type="text" id="addFriendInput" placeholder="Add friend by username">
            <button id="addFriendBtn">➕ Add</button>
        </div>
        <div id="friendsList"></div>
        <div class="group-section">
            <input type="text" id="groupRoomInput" placeholder="Enter room name to join">
            <button id="joinGroupBtn">👥 Join Group</button>
        </div>
        <button id="createGroupBtn" class="call-btn" style="width:100%; margin-top:10px;"><i class="fas fa-plus-circle"></i> Create New Group Room</button>
    </div>
</div>

<div id="callOverlay" class="call-overlay hidden">
    <div class="call-header">
        <div class="call-controls">
            <button id="toggleMicBtn"><i class="fas fa-microphone"></i> Mute</button>
            <button id="toggleVideoBtn"><i class="fas fa-video"></i> Video Off</button>
            <button id="screenShareBtn"><i class="fas fa-desktop"></i> Share</button>
            <button id="toggleChatBtn"><i class="fas fa-comment"></i> Chat</button>
            <button id="endCallBtn" class="end-call"><i class="fas fa-phone-slash"></i> End</button>
        </div>
    </div>
    <div style="display: flex; flex: 1; overflow: hidden;">
        <div class="video-grid" id="videoGrid">
            <div class="video-container"><video id="localVideo" autoplay muted playsinline></video></div>
            <div class="video-container"><video id="remoteVideo" autoplay playsinline></video></div>
        </div>
        <div id="chatPanel" class="chat-panel hidden">
            <div id="chatMessages" class="chat-messages"></div>
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="Type a message...">
                <button id="sendChatBtn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>
</div>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyAW4j8PG_rzXIe8Lj8lLMnSSjZSUnLkhTk",
        authDomain: "tiktok-211df.firebaseapp.com",
        projectId: "tiktok-211df",
        storageBucket: "tiktok-211df.firebasestorage.app",
        messagingSenderId: "835878907951",
        appId: "1:835878907951:web:83e64a7d9e28d6706056da"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // TURN Configuration from Metered
    const TURN_CONFIG = {
        iceServers: [
            { urls: "stun:stun.relay.metered.ca:80" },
            { urls: "turn:global.relay.metered.ca:80", username: "80d7f1b46c263f4738b8ee87", credential: "rudw4iGDMIQLP/Y6" },
            { urls: "turn:global.relay.metered.ca:80?transport=tcp", username: "80d7f1b46c263f4738b8ee87", credential: "rudw4iGDMIQLP/Y6" },
            { urls: "turn:global.relay.metered.ca:443", username: "80d7f1b46c263f4738b8ee87", credential: "rudw4iGDMIQLP/Y6" },
            { urls: "turns:global.relay.metered.ca:443?transport=tcp", username: "80d7f1b46c263f4738b8ee87", credential: "rudw4iGDMIQLP/Y6" }
        ]
    };

    let currentUser = null;
    let localStream = null;
    let screenStream = null;
    let currentPeer = null;
    let currentCall = null;
    let currentRoom = null;
    let isScreenSharing = false;
    let heartbeatInterval = null;
    let callListenerUnsub = null;
    let chatUnsub = null;

    function showToast(msg) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = `<i class="fas fa-info-circle"></i> ${msg}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    async function getCamera() {
        try {
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('localVideo').srcObject = localStream;
            return true;
        } catch(e) { showToast("Camera/mic access needed"); return false; }
    }

    async function startScreenShare() {
        if (!currentCall) return;
        try {
            if (isScreenSharing) {
                // Stop screen share, revert to camera
                const videoTrack = localStream.getVideoTracks()[0];
                if (videoTrack) videoTrack.stop();
                const newStream = await navigator.mediaDevices.getUserMedia({ video: true });
                const newVideoTrack = newStream.getVideoTracks()[0];
                const sender = currentCall.peerConnection?.getSenders().find(s => s.track?.kind === 'video');
                if (sender) await sender.replaceTrack(newVideoTrack);
                localStream.removeTrack(videoTrack);
                localStream.addTrack(newVideoTrack);
                document.getElementById('localVideo').srcObject = localStream;
                isScreenSharing = false;
                document.getElementById('screenShareBtn').style.background = '#2c2c2e';
                showToast("Screen share stopped");
            } else {
                const screenStream_ = await navigator.mediaDevices.getDisplayMedia({ video: true });
                const screenTrack = screenStream_.getVideoTracks()[0];
                const sender = currentCall.peerConnection?.getSenders().find(s => s.track?.kind === 'video');
                if (sender) await sender.replaceTrack(screenTrack);
                screenTrack.onended = () => startScreenShare(); // auto-stop
                localStream.removeTrack(localStream.getVideoTracks()[0]);
                localStream.addTrack(screenTrack);
                document.getElementById('localVideo').srcObject = localStream;
                isScreenSharing = true;
                document.getElementById('screenShareBtn').style.background = '#00d4ff';
                showToast("Sharing screen");
            }
        } catch(e) { showToast("Screen share cancelled"); }
    }

    function toggleMic() {
        if (localStream) {
            const audio = localStream.getAudioTracks()[0];
            if (audio) audio.enabled = !audio.enabled;
            const btn = document.getElementById('toggleMicBtn');
            btn.innerHTML = audio?.enabled ? '<i class="fas fa-microphone"></i> Mute' : '<i class="fas fa-microphone-slash"></i> Unmute';
        }
    }

    function toggleVideo() {
        if (localStream) {
            const video = localStream.getVideoTracks()[0];
            if (video) video.enabled = !video.enabled;
            const btn = document.getElementById('toggleVideoBtn');
            btn.innerHTML = video?.enabled ? '<i class="fas fa-video"></i> Video Off' : '<i class="fas fa-video-slash"></i> Video On';
        }
    }

    function toggleChat() {
        document.getElementById('chatPanel').classList.toggle('hidden');
    }

    async function sendChatMessage() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text || !currentRoom) return;
        await db.collection('groupChats').doc(currentRoom).collection('messages').add({
            from: currentUser,
            text: text,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        input.value = '';
    }

    function setupChatListener(roomId) {
        if (chatUnsub) chatUnsub();
        const messagesDiv = document.getElementById('chatMessages');
        messagesDiv.innerHTML = '';
        chatUnsub = db.collection('groupChats').doc(roomId).collection('messages')
            .orderBy('timestamp')
            .onSnapshot(snap => {
                snap.docChanges().forEach(change => {
                    if (change.type === 'added') {
                        const msg = change.doc.data();
                        const div = document.createElement('div');
                        div.innerHTML = `<strong>${escapeHtml(msg.from)}:</strong> ${escapeHtml(msg.text)}`;
                        messagesDiv.appendChild(div);
                        messagesDiv.scrollTop = messagesDiv.scrollHeight;
                    }
                });
            });
    }

    async function startCall(friendId) {
        const status = await getStatus(friendId);
        if (!status) { showToast(`${friendId} is offline`); return; }
        
        const ok = await getCamera();
        if (!ok) return;

        const roomId = `1on1_${currentUser}_${friendId}_${Date.now()}`;
        currentRoom = roomId;
        
        const callDoc = await db.collection('activeCalls').add({
            type: 'private',
            roomId: roomId,
            from: currentUser,
            to: friendId,
            status: 'ringing',
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        
        document.getElementById('callOverlay').classList.remove('hidden');
        document.getElementById('appSection').classList.add('hidden');
        document.getElementById('callStatus').innerHTML = '<i class="fas fa-phone-alt"></i> Calling...';
        
        const friendPeerDoc = await db.collection('peers').doc(friendId).get();
        if (!friendPeerDoc.exists) { showToast("Friend offline"); endCall(); return; }
        
        const call = currentPeer.call(friendPeerDoc.data().peerId, localStream);
        currentCall = call;
        setupChatListener(roomId);
        
        call.on('stream', (remoteStream) => {
            document.getElementById('remoteVideo').srcObject = remoteStream;
            document.getElementById('callStatus').innerHTML = '<i class="fas fa-phone-alt"></i> In call';
        });
        call.on('close', () => endCall());
        call.on('error', () => { showToast("Call failed"); endCall(); });
        
        await callDoc.delete();
    }

    async function joinGroupCall(roomId) {
        const ok = await getCamera();
        if (!ok) return;
        
        currentRoom = roomId;
        document.getElementById('callOverlay').classList.remove('hidden');
        document.getElementById('appSection').classList.add('hidden');
        document.getElementById('callStatus').innerHTML = '<i class="fas fa-users"></i> Group call';
        
        // For group calls, we need to connect to all participants
        // This is a simplified version - each participant calls the room
        const groupRef = db.collection('groupRooms').doc(roomId);
        const groupDoc = await groupRef.get();
        
        if (!groupDoc.exists) {
            // Creator: create room and wait for others
            await groupRef.set({ creator: currentUser, participants: [currentUser], createdAt: new Date() });
            await db.collection('peers').doc(currentUser).update({ groupRoom: roomId });
            setupChatListener(roomId);
            // Listen for new participants
            groupRef.onSnapshot(async (snap) => {
                const data = snap.data();
                if (data && data.participants) {
                    for (const p of data.participants) {
                        if (p !== currentUser && !currentCall) {
                            const peerDoc = await db.collection('peers').doc(p).get();
                            if (peerDoc.exists) {
                                const call = currentPeer.call(peerDoc.data().peerId, localStream);
                                currentCall = call;
                                call.on('stream', (stream) => {
                                    // For multiple participants, we'd need more video elements
                                    document.getElementById('remoteVideo').srcObject = stream;
                                });
                            }
                        }
                    }
                }
            });
        } else {
            // Joiner: add self to participants
            await groupRef.update({ participants: firebase.firestore.FieldValue.arrayUnion(currentUser) });
            setupChatListener(roomId);
            // Call the creator
            const creatorPeer = await db.collection('peers').doc(groupDoc.data().creator).get();
            if (creatorPeer.exists) {
                const call = currentPeer.call(creatorPeer.data().peerId, localStream);
                currentCall = call;
                call.on('stream', (stream) => {
                    document.getElementById('remoteVideo').srcObject = stream;
                });
            }
        }
    }

    async function createGroupRoom() {
        const roomName = prompt("Enter room name:", "group_" + Date.now());
        if (roomName) await joinGroupCall(roomName);
    }

    function endCall() {
        if (currentCall) currentCall.close();
        if (currentRoom) {
            db.collection('groupRooms').doc(currentRoom).update({ participants: firebase.firestore.FieldValue.arrayRemove(currentUser) }).catch(()=>{});
        }
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        if (screenStream) screenStream.getTracks().forEach(t => t.stop());
        localStream = null;
        currentCall = null;
        currentRoom = null;
        isScreenSharing = false;
        document.getElementById('callOverlay').classList.add('hidden');
        document.getElementById('appSection').classList.remove('hidden');
        document.getElementById('remoteVideo').srcObject = null;
        document.getElementById('localVideo').srcObject = null;
        document.getElementById('screenShareBtn').style.background = '#2c2c2e';
        showToast("Call ended");
    }

    function listenForIncomingCalls() {
        if (callListenerUnsub) callListenerUnsub();
        callListenerUnsub = db.collection('activeCalls')
            .where('to', '==', currentUser)
            .where('status', '==', 'ringing')
            .onSnapshot(snap => {
                snap.forEach(async doc => {
                    const call = doc.data();
                    if (call && call.from !== currentUser && !document.getElementById('incomingModal')) {
                        const modal = document.createElement('div');
                        modal.id = 'incomingModal';
                        modal.className = 'incoming-modal';
                        modal.innerHTML = `
                            <div style="width:80px;height:80px;background:#00d4ff20;border-radius:50%;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;animation:pulse 1s infinite;">
                                <i class="fas fa-phone" style="font-size:35px;color:#00d4ff;"></i>
                            </div>
                            <h3>Incoming Call</h3>
                            <p>from <strong>${escapeHtml(call.from)}</strong></p>
                            <div>
                                <button class="accept" onclick="acceptCall('${doc.id}', '${call.from}', '${call.roomId}')">Accept</button>
                                <button class="decline" onclick="declineCall('${doc.id}')">Decline</button>
                            </div>
                        `;
                        document.body.appendChild(modal);
                    }
                });
            });
    }

    async function acceptCall(callId, fromUser, roomId) {
        document.getElementById('incomingModal')?.remove();
        currentRoom = roomId;
        const ok = await getCamera();
        if (!ok) return;
        
        document.getElementById('callOverlay').classList.remove('hidden');
        document.getElementById('appSection').classList.add('hidden');
        document.getElementById('callStatus').innerHTML = '<i class="fas fa-phone-alt"></i> Connecting...';
        
        const fromPeer = await db.collection('peers').doc(fromUser).get();
        if (fromPeer.exists) {
            const call = currentPeer.call(fromPeer.data().peerId, localStream);
            currentCall = call;
            setupChatListener(roomId);
            call.on('stream', (stream) => {
                document.getElementById('remoteVideo').srcObject = stream;
                document.getElementById('callStatus').innerHTML = '<i class="fas fa-phone-alt"></i> In call';
            });
            call.on('close', () => endCall());
        }
        await db.collection('activeCalls').doc(callId).delete();
    }

    async function declineCall(callId) {
        await db.collection('activeCalls').doc(callId).delete();
        document.getElementById('incomingModal')?.remove();
    }

    async function initPeer() {
        return new Promise((resolve) => {
            const peer = new Peer(null, { config: TURN_CONFIG });
            peer.on('open', (id) => {
                currentPeer = peer;
                resolve(id);
            });
            peer.on('error', (err) => console.log("Peer error:", err));
        });
    }

    async function setStatus(userId, online) {
        await db.collection('presence').doc(userId).set({ online, lastSeen: new Date() }, { merge: true });
    }

    async function getStatus(userId) {
        const snap = await db.collection('presence').doc(userId).get();
        return snap.exists ? snap.data().online : false;
    }

    async function startHeartbeat() {
        if (heartbeatInterval) clearInterval(heartbeatInterval);
        await setStatus(currentUser, true);
        heartbeatInterval = setInterval(() => setStatus(currentUser, true), 15000);
        window.addEventListener('beforeunload', () => setStatus(currentUser, false));
    }

    async function sendFriendRequest(username) {
        if (username === currentUser) { showToast("Can't add yourself"); return; }
        const userRef = db.collection('users').doc(currentUser);
        const doc = await userRef.get();
        const friends = doc.exists ? doc.data().friends || [] : [];
        if (friends.includes(username)) { showToast("Already friends"); return; }
        await userRef.update({ friends: firebase.firestore.FieldValue.arrayUnion(username) });
        await db.collection('users').doc(username).update({ friends: firebase.firestore.FieldValue.arrayUnion(currentUser) });
        loadFriends();
    }

    async function loadFriends() {
        const doc = await db.collection('users').doc(currentUser).get();
        const friends = doc.exists ? doc.data().friends || [] : [];
        const container = document.getElementById('friendsList');
        if (!container) return;
        
        if (friends.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:#666; padding:30px;">No friends yet. Add someone!</div>';
            return;
        }
        
        let html = '';
        for (const f of friends) {
            const online = await getStatus(f);
            html += `<div class="friend-item">
                <div class="avatar"><i class="fas fa-user-circle"></i><span class="${online ? 'online-dot' : 'offline-dot'}"></span></div>
                <div class="friend-info">
                    <div class="friend-name">${escapeHtml(f)}</div>
                    <div class="status-text">${online ? '🟢 Online' : '⚫ Offline'}</div>
                </div>
                <button class="call-btn" onclick="startCall('${f}')" ${!online ? 'disabled' : ''}><i class="fas fa-video"></i> Call</button>
            </div>`;
        }
        container.innerHTML = html;
    }

    async function initUser() {
        const ref = db.collection('users').doc(currentUser);
        if (!(await ref.get()).exists) {
            await ref.set({ username: currentUser, friends: [], createdAt: new Date() });
        }
        await loadFriends();
        setInterval(() => loadFriends(), 5000);
    }

    async function handleAuth() {
        const username = document.getElementById('username').value.trim().toLowerCase();
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('authError');
        
        if (!username || password.length < 4) {
            errorDiv.innerText = 'Username and password (min 4 chars)';
            return;
        }
        
        const userRef = db.collection('users').doc(username);
        const doc = await userRef.get();
        
        if (!doc.exists) {
            await userRef.set({ username, friends: [], passwordHash: btoa(password), createdAt: new Date() });
            errorDiv.innerText = '✅ Account created!';
        } else if (doc.data().passwordHash !== btoa(password)) {
            errorDiv.innerText = '❌ Wrong password';
            return;
        }
        
        currentUser = username;
        const peerId = await initPeer();
        await db.collection('peers').doc(username).set({ peerId });
        await startHeartbeat();
        await initUser();
        listenForIncomingCalls();
        
        for (const u of ['Alice', 'Bob', 'Charlie']) {
            if (u !== username) await setStatus(u, true);
        }
        
        document.getElementById('authSection').style.display = 'none';
        document.getElementById('appSection').classList.remove('hidden');
        errorDiv.innerText = '';
        showToast(`Welcome ${username}`);
    }

    function logout() {
        if (heartbeatInterval) clearInterval(heartbeatInterval);
        if (callListenerUnsub) callListenerUnsub();
        if (chatUnsub) chatUnsub();
        if (currentUser) setStatus(currentUser, false);
        if (currentCall) endCall();
        if (currentPeer) currentPeer.destroy();
        currentUser = null;
        document.getElementById('authSection').style.display = 'block';
        document.getElementById('appSection').classList.add('hidden');
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
    }

    function escapeHtml(str) { return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }

    // Event listeners
    document.getElementById('loginBtn').onclick = handleAuth;
    document.getElementById('logoutBtn').onclick = logout;
    document.getElementById('addFriendBtn').onclick = () => {
        const name = document.getElementById('addFriendInput').value.trim().toLowerCase();
        if (name) sendFriendRequest(name);
    };
    document.getElementById('joinGroupBtn').onclick = () => {
        const room = document.getElementById('groupRoomInput').value.trim();
        if (room) joinGroupCall(room);
        else showToast("Enter room name");
    };
    document.getElementById('createGroupBtn').onclick = createGroupRoom;
    document.getElementById('endCallBtn').onclick = endCall;
    document.getElementById('toggleMicBtn').onclick = toggleMic;
    document.getElementById('toggleVideoBtn').onclick = toggleVideo;
    document.getElementById('screenShareBtn').onclick = startScreenShare;
    document.getElementById('toggleChatBtn').onclick = toggleChat;
    document.getElementById('sendChatBtn').onclick = sendChatMessage;
    document.getElementById('chatInput').addEventListener('keypress', e => { if (e.key === 'Enter') sendChatMessage(); });
    document.getElementById('username').addEventListener('keypress', e => { if (e.key === 'Enter') handleAuth(); });
    document.getElementById('password').addEventListener('keypress', e => { if (e.key === 'Enter') handleAuth(); });
</script>
</body>
</html>
