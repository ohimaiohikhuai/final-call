<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Chatrix · Video Calls (Remote Video Fixed)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; font-family: system-ui, sans-serif; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        .auth-card { background: #121212; border-radius: 40px; padding: 32px; text-align: center; border: 1px solid #262626; }
        .auth-card h2 { color: #00d4ff; margin-bottom: 20px; }
        .auth-card input { width: 100%; padding: 14px; background: #1f1f1f; border: none; border-radius: 60px; color: white; margin-bottom: 12px; font-size: 16px; }
        .auth-card button { width: 100%; background: #00d4ff; border: none; padding: 14px; border-radius: 60px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .error-msg { color: #ff8080; font-size: 13px; margin-top: 12px; }
        
        .friend-item { background: #121212; border-radius: 24px; padding: 14px 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 14px; border: 1px solid #242424; }
        .avatar { width: 52px; height: 52px; background: #1e2a2e; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; position: relative; }
        .online-dot { position: absolute; bottom: 2px; right: 2px; width: 14px; background: #22c55e; border-radius: 50%; border: 2px solid #121212; }
        .offline-dot { background: #5f6c6f; }
        .friend-info { flex: 1; }
        .friend-name { color: white; font-weight: 600; font-size: 17px; }
        .status-text { color: #888; font-size: 12px; margin-top: 4px; }
        .call-btn { background: rgba(0,212,255,0.1); border: 1px solid #00d4ff; color: #00d4ff; padding: 8px 14px; border-radius: 40px; font-size: 14px; cursor: pointer; margin-left: 8px; }
        .call-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        
        .call-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; display: flex; flex-direction: column; }
        .call-header { background: #1a1a1a; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .call-controls { display: flex; gap: 12px; flex-wrap: wrap; }
        .call-controls button { background: #2c2c2e; border: none; color: white; padding: 8px 16px; border-radius: 30px; cursor: pointer; font-weight: bold; }
        .call-controls button.end-call { background: #ff3b30; }
        .video-grid { flex: 1; display: flex; flex-wrap: wrap; gap: 10px; padding: 20px; background: #0a0a0a; }
        .video-container { flex: 1; min-width: 250px; background: #1a1a1a; border-radius: 16px; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; aspect-ratio: 4/3; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .chat-panel { width: 280px; background: #121212; border-left: 1px solid #333; display: flex; flex-direction: column; padding: 12px; }
        .chat-messages { flex: 1; overflow-y: auto; font-size: 13px; color: #ccc; margin-bottom: 12px; }
        .chat-input { display: flex; gap: 8px; }
        .chat-input input { flex: 1; padding: 8px; background: #2c2c2e; border: none; border-radius: 20px; color: white; }
        .chat-input button { background: #00d4ff; border: none; padding: 8px 12px; border-radius: 20px; cursor: pointer; }
        
        .incoming-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #121212; border-radius: 40px; padding: 32px; text-align: center; z-index: 2000; border: 2px solid #00d4ff; min-width: 280px; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.05); } 100% { transform: translate(-50%, -50%) scale(1); } }
        .incoming-modal button { padding: 10px 20px; border-radius: 40px; font-weight: bold; margin: 0 10px; cursor: pointer; }
        .accept { background: #22c55e; border: none; color: white; }
        .decline { background: #ff3b30; border: none; color: white; }
        
        .header { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .header h2 { color: #00d4ff; }
        .logout-btn { background: #2c2c2e; border: none; color: #aaa; padding: 8px 16px; border-radius: 40px; cursor: pointer; }
        .add-friend-section { margin-bottom: 16px; display: flex; gap: 10px; }
        .add-friend-section input { flex: 1; padding: 12px; background: #1f1f1f; border: none; border-radius: 60px; color: white; }
        .add-friend-section button { background: rgba(0,212,255,0.1); border: 1px solid #00d4ff; color: #00d4ff; padding: 0 20px; border-radius: 60px; cursor: pointer; }
        .group-call-section { display: flex; gap: 10px; margin-top: 16px; }
        .group-call-section input { flex: 1; padding: 12px; background: #1f1f1f; border: none; border-radius: 60px; color: white; }
        .group-call-section button { background: rgba(0,212,255,0.1); border: 1px solid #00d4ff; color: #00d4ff; padding: 0 20px; border-radius: 60px; cursor: pointer; }
        
        .toast { position: fixed; bottom: 100px; left: 20px; right: 20px; background: #1e2a2e; border-left: 4px solid #00d4ff; padding: 14px; border-radius: 16px; z-index: 2000; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .hidden { display: none; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/js/all.min.js"></script>
</head>
<body>
<div class="container">
    <div id="authSection" class="auth-card">
        <h2><i class="fas fa-video"></i> Chatrix Calls</h2>
        <input type="text" id="username" placeholder="Username" autocomplete="off">
        <input type="password" id="password" placeholder="Password (min 4 chars)">
        <button id="loginBtn">Login / Sign Up</button>
        <div id="authError" class="error-msg"></div>
        <p style="color:#888; font-size:12px; margin-top:16px;">🔐 Peer‑to‑peer video · Remote video fixed</p>
    </div>

    <div id="appSection" class="hidden">
        <div class="header">
            <h2><i class="fas fa-comment"></i> Chatrix</h2>
            <button id="logoutBtn" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
        <div class="add-friend-section">
            <input type="text" id="addFriendInput" placeholder="Add friend by username">
            <button id="addFriendBtn">➕ Add</button>
        </div>
        <div id="friendsList"></div>
        <div class="group-call-section">
            <input type="text" id="groupRoomInput" placeholder="Room name to join group call">
            <button id="joinGroupCallBtn">🔗 Join Group Call</button>
        </div>
        <button id="startGroupCallBtn" class="group-call-btn" style="width:100%; margin-top:10px;"><i class="fas fa-users"></i> Create New Group Call</button>
        <p style="color:#666; font-size:11px; text-align:center; margin-top:20px;">🔐 WebRTC direct · No moderator</p>
    </div>
</div>

<div id="callOverlay" class="call-overlay hidden">
    <div class="call-header">
        <div class="call-controls">
            <button id="toggleMicBtn"><i class="fas fa-microphone"></i> Mute</button>
            <button id="toggleVideoBtn"><i class="fas fa-video"></i> Video Off</button>
            <button id="screenShareBtn"><i class="fas fa-desktop"></i> Share Screen</button>
            <button id="toggleChatBtn"><i class="fas fa-comment"></i> Chat</button>
            <button id="endCallBtn" class="end-call"><i class="fas fa-phone-slash"></i> End Call</button>
        </div>
    </div>
    <div style="display: flex; flex: 1; overflow: hidden;">
        <div class="video-grid" id="videoGrid">
            <div class="video-container"><video id="localVideo" autoplay muted playsinline></video></div>
            <div class="video-container"><video id="remoteVideo" autoplay playsinline></video></div>
        </div>
        <div id="chatPanel" class="chat-panel hidden">
            <div id="chatMessages" class="chat-messages"></div>
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="Type a message...">
                <button id="sendChatBtn">Send</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyAW4j8PG_rzXIe8Lj8lLMnSSjZSUnLkhTk",
        authDomain: "tiktok-211df.firebaseapp.com",
        projectId: "tiktok-211df",
        storageBucket: "tiktok-211df.firebasestorage.app",
        messagingSenderId: "835878907951",
        appId: "1:835878907951:web:83e64a7d9e28d6706056da"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentUserId = null;
    let localStream = null;
    let peerConnection = null;
    let currentCallDocId = null;
    let callListenerUnsub = null;
    let signalListenerUnsub = null;
    let heartbeatInterval = null;
    let localVideoEnabled = true;
    let localMicEnabled = true;
    let isScreenSharing = false;
    let originalVideoTrack = null;
    let chatUnsub = null;
    let remoteStream = null;

    const demoUsers = ['Alice', 'Bob', 'Charlie', 'Diana'];

    const configuration = {
        iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' }
        ]
    };

    function showToast(msg) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = `<i class="fas fa-info-circle"></i> ${msg}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 4000);
    }

    // --- WebRTC helpers ---
    async function getLocalStream() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
            }
            localStream = stream;
            document.getElementById('localVideo').srcObject = localStream;
            return true;
        } catch (e) {
            showToast("Camera/microphone access denied");
            return false;
        }
    }

    async function createPeerConnection(isCaller, callDocRef) {
        const pc = new RTCPeerConnection(configuration);
        // Add local tracks if we have them
        if (localStream) {
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
        }
        pc.ontrack = (event) => {
            if (event.streams[0]) {
                remoteStream = event.streams[0];
                document.getElementById('remoteVideo').srcObject = remoteStream;
                showToast("Remote video received");
            }
        };
        pc.onicecandidate = async (event) => {
            if (event.candidate) {
                await callDocRef.update({
                    iceCandidates: firebase.firestore.FieldValue.arrayUnion({
                        candidate: event.candidate,
                        from: currentUserId
                    })
                });
            }
        };
        pc.oniceconnectionstatechange = () => {
            console.log("ICE state:", pc.iceConnectionState);
            if (pc.iceConnectionState === 'connected') {
                showToast("Call established");
            } else if (pc.iceConnectionState === 'failed') {
                showToast("Connection failed");
                endCall();
            }
        };
        return pc;
    }

    // --- 1-on-1 call (caller) ---
    async function startCall(friendName) {
        const status = await getStatus(friendName);
        if (status !== 'online') {
            showToast(`${friendName} is offline`);
            return;
        }
        const callId = `${currentUserId}_${friendName}_${Date.now()}`;
        const callDocRef = db.collection('calls').doc(callId);
        await callDocRef.set({
            from: currentUserId,
            to: friendName,
            status: 'ringing',
            roomName: callId,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            offer: null,
            answer: null,
            iceCandidates: []
        });
        currentCallDocId = callId;
        showCallUI();
        const ok = await getLocalStream();
        if (!ok) return;
        peerConnection = await createPeerConnection(true, callDocRef);
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        await callDocRef.update({ offer: offer });
        // Listen for answer and ICE
        signalListenerUnsub = callDocRef.onSnapshot(async (snap) => {
            const data = snap.data();
            if (!data) return;
            if (data.answer && peerConnection.signalingState === 'have-local-offer') {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                showToast("Call connected");
                await callDocRef.update({ status: 'active' });
                setupChatListener(callId);
            }
            if (data.iceCandidates && data.iceCandidates.length) {
                for (const ice of data.iceCandidates) {
                    if (ice.from !== currentUserId) {
                        try {
                            await peerConnection.addIceCandidate(new RTCIceCandidate(ice.candidate));
                        } catch(e) {}
                    }
                }
                await callDocRef.update({ iceCandidates: [] });
            }
        });
        await setStatus(currentUserId, 'busy');
    }

    // --- Accept incoming call ---
    async function acceptCall(callId, fromUser) {
        // Remove modal immediately
        const modal = document.getElementById('incomingModal');
        if (modal) modal.remove();
        currentCallDocId = callId;
        const callDocRef = db.collection('calls').doc(callId);
        showCallUI();
        const ok = await getLocalStream();
        if (!ok) return;
        peerConnection = await createPeerConnection(false, callDocRef);
        // Wait for offer
        const unsubOffer = callDocRef.onSnapshot(async (snap) => {
            const data = snap.data();
            if (!data) return;
            if (data.offer && !peerConnection.currentRemoteDescription) {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                await callDocRef.update({ answer: answer });
                unsubOffer(); // stop listening for offer after we answer
            }
            if (data.iceCandidates && data.iceCandidates.length) {
                for (const ice of data.iceCandidates) {
                    if (ice.from !== currentUserId) {
                        try {
                            await peerConnection.addIceCandidate(new RTCIceCandidate(ice.candidate));
                        } catch(e) {}
                    }
                }
                await callDocRef.update({ iceCandidates: [] });
            }
        });
        signalListenerUnsub = unsubOffer;
        await callDocRef.update({ status: 'active' });
        await setStatus(currentUserId, 'busy');
        setupChatListener(callId);
        showToast("Call accepted");
    }

    async function declineCall(callId) {
        await db.collection('calls').doc(callId).delete();
        const modal = document.getElementById('incomingModal');
        if (modal) modal.remove();
    }

    function showCallUI() {
        document.getElementById('callOverlay').classList.remove('hidden');
        document.getElementById('appSection').classList.add('hidden');
    }

    function endCall() {
        if (peerConnection) peerConnection.close();
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        if (currentCallDocId) {
            db.collection('calls').doc(currentCallDocId).delete().catch(()=>{});
            db.collection('callChats').doc(currentCallDocId).delete().catch(()=>{});
        }
        if (signalListenerUnsub) signalListenerUnsub();
        if (chatUnsub) chatUnsub();
        peerConnection = null;
        localStream = null;
        remoteStream = null;
        currentCallDocId = null;
        document.getElementById('callOverlay').classList.add('hidden');
        document.getElementById('appSection').classList.remove('hidden');
        document.getElementById('remoteVideo').srcObject = null;
        document.getElementById('localVideo').srcObject = null;
        setStatus(currentUserId, 'online');
        showToast("Call ended");
        localVideoEnabled = true;
        localMicEnabled = true;
        isScreenSharing = false;
        originalVideoTrack = null;
    }

    // --- Call controls ---
    function toggleMic() {
        if (localStream) {
            const audioTracks = localStream.getAudioTracks();
            audioTracks.forEach(t => t.enabled = !t.enabled);
            localMicEnabled = audioTracks[0]?.enabled ?? true;
            const btn = document.getElementById('toggleMicBtn');
            btn.innerHTML = localMicEnabled ? '<i class="fas fa-microphone"></i> Mute' : '<i class="fas fa-microphone-slash"></i> Unmute';
        }
    }
    function toggleVideo() {
        if (localStream) {
            const videoTracks = localStream.getVideoTracks();
            videoTracks.forEach(t => t.enabled = !t.enabled);
            localVideoEnabled = videoTracks[0]?.enabled ?? true;
            const btn = document.getElementById('toggleVideoBtn');
            btn.innerHTML = localVideoEnabled ? '<i class="fas fa-video"></i> Video Off' : '<i class="fas fa-video-slash"></i> Video On';
        }
    }
    async function toggleScreenShare() {
        if (!peerConnection) return;
        if (!isScreenSharing) {
            try {
                const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                const videoTrack = screenStream.getVideoTracks()[0];
                originalVideoTrack = localStream.getVideoTracks()[0];
                const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                if (sender) await sender.replaceTrack(videoTrack);
                // Update local preview
                const newStream = new MediaStream();
                localStream.getAudioTracks().forEach(t => newStream.addTrack(t));
                newStream.addTrack(videoTrack);
                localStream = newStream;
                document.getElementById('localVideo').srcObject = localStream;
                videoTrack.onended = () => stopScreenShare();
                isScreenSharing = true;
                showToast("Sharing screen");
            } catch(e) { showToast("Screen share cancelled"); }
        } else {
            stopScreenShare();
        }
    }
    function stopScreenShare() {
        if (originalVideoTrack && peerConnection) {
            const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
            if (sender) sender.replaceTrack(originalVideoTrack);
            const newStream = new MediaStream();
            localStream.getAudioTracks().forEach(t => newStream.addTrack(t));
            newStream.addTrack(originalVideoTrack);
            localStream = newStream;
            document.getElementById('localVideo').srcObject = localStream;
            isScreenSharing = false;
            showToast("Screen share stopped");
        }
    }
    function toggleChat() {
        document.getElementById('chatPanel').classList.toggle('hidden');
    }
    async function sendChatMessage() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text || !currentCallDocId) return;
        await db.collection('callChats').doc(currentCallDocId).collection('messages').add({
            from: currentUserId,
            text: text,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        input.value = '';
    }
    function setupChatListener(callId) {
        if (chatUnsub) chatUnsub();
        const messagesDiv = document.getElementById('chatMessages');
        chatUnsub = db.collection('callChats').doc(callId).collection('messages')
            .orderBy('timestamp')
            .onSnapshot(snap => {
                snap.docChanges().forEach(change => {
                    if (change.type === 'added') {
                        const msg = change.doc.data();
                        const div = document.createElement('div');
                        div.innerHTML = `<strong>${escapeHtml(msg.from)}:</strong> ${escapeHtml(msg.text)}`;
                        messagesDiv.appendChild(div);
                        messagesDiv.scrollTop = messagesDiv.scrollHeight;
                    }
                });
            });
    }

    // --- Incoming call listener ---
    function listenForIncomingCalls() {
        if (callListenerUnsub) callListenerUnsub();
        callListenerUnsub = db.collection('calls')
            .where('to', '==', currentUserId)
            .where('status', '==', 'ringing')
            .onSnapshot((snapshot) => {
                snapshot.forEach((doc) => {
                    const call = doc.data();
                    if (call && call.from !== currentUserId && !document.getElementById('incomingModal')) {
                        const modal = document.createElement('div');
                        modal.id = 'incomingModal';
                        modal.className = 'incoming-modal';
                        modal.innerHTML = `
                            <div style="width:80px;height:80px;background:#00d4ff20;border-radius:50%;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;animation:pulse 1s infinite;">
                                <i class="fas fa-phone" style="font-size:35px;color:#00d4ff;transform:rotate(90deg);"></i>
                            </div>
                            <h3>Incoming Video Call</h3>
                            <p>from <strong>${escapeHtml(call.from)}</strong></p>
                            <div>
                                <button class="accept" onclick="acceptCall('${doc.id}', '${call.from}')">Accept</button>
                                <button class="decline" onclick="declineCall('${doc.id}')">Decline</button>
                            </div>
                        `;
                        document.body.appendChild(modal);
                    }
                });
            });
    }

    // --- Group call (simple room join) ---
    async function joinGroupCall(roomName) {
        if (!roomName) return;
        currentCallDocId = `group_${roomName}`;
        const groupRef = db.collection('groupSignals').doc(currentCallDocId);
        showCallUI();
        const ok = await getLocalStream();
        if (!ok) return;
        peerConnection = new RTCPeerConnection(configuration);
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
        peerConnection.ontrack = (event) => {
            if (event.streams[0]) {
                document.getElementById('remoteVideo').srcObject = event.streams[0];
                showToast("Remote video received");
            }
        };
        peerConnection.onicecandidate = async (event) => {
            if (event.candidate) {
                await groupRef.update({
                    candidates: firebase.firestore.FieldValue.arrayUnion({
                        candidate: event.candidate,
                        from: currentUserId
                    })
                });
            }
        };
        await groupRef.set({ offer: null, answer: null, candidates: [] }, { merge: true });
        const unsub = groupRef.onSnapshot(async (snap) => {
            const data = snap.data();
            if (!data) return;
            if (data.offer && !peerConnection.currentRemoteDescription) {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                await groupRef.update({ answer: answer });
            }
            if (data.answer && peerConnection.signalingState === 'have-local-offer') {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
            }
            if (data.candidates && data.candidates.length) {
                for (const ice of data.candidates) {
                    if (ice.from !== currentUserId) {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(ice.candidate));
                    }
                }
                await groupRef.update({ candidates: [] });
            }
        });
        signalListenerUnsub = unsub;
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        await groupRef.update({ offer: offer });
        showToast(`Joined group call: ${roomName}`);
        await setStatus(currentUserId, 'busy');
    }

    async function createNewGroupCall() {
        const roomName = prompt("Enter a room name for your group call", `group_${Date.now()}`);
        if (roomName) await joinGroupCall(roomName);
    }

    // --- Presence & Friends ---
    async function setStatus(userId, status) {
        if (!userId) return;
        await db.collection('presence').doc(userId).set({ status, lastSeen: new Date() }, { merge: true });
    }
    async function getStatus(userId) {
        try {
            const snap = await db.collection('presence').doc(userId).get();
            return snap.exists ? snap.data().status || 'offline' : 'offline';
        } catch(e) { return 'offline'; }
    }
    async function startHeartbeat() {
        if(heartbeatInterval) clearInterval(heartbeatInterval);
        await setStatus(currentUserId, 'online');
        heartbeatInterval = setInterval(() => setStatus(currentUserId, 'online'), 15000);
        window.addEventListener('beforeunload', () => setStatus(currentUserId, 'offline'));
    }

    async function sendFriendRequest(username) {
        if(username === currentUserId) { showToast("Can't add yourself"); return; }
        const userRef = db.collection('users').doc(currentUserId);
        const userDoc = await userRef.get();
        const currentFriends = userDoc.exists ? userDoc.data().friends || [] : [];
        if(currentFriends.includes(username)) { showToast("Already friends"); return; }
        await userRef.update({ friends: firebase.firestore.FieldValue.arrayUnion(username) });
        await db.collection('users').doc(username).update({ friends: firebase.firestore.FieldValue.arrayUnion(currentUserId) });
        showToast(`Added ${username}`);
        loadFriends();
    }

    async function loadFriends() {
        const userDoc = await db.collection('users').doc(currentUserId).get();
        const friends = userDoc.exists ? userDoc.data().friends || [] : [];
        const container = document.getElementById('friendsList');
        if(!container) return;
        const allSuggestions = demoUsers.filter(u => u !== currentUserId && !friends.includes(u));
        if(friends.length === 0 && allSuggestions.length === 0) {
            container.innerHTML = `<div style="background:#121212; border-radius:24px; padding:30px; text-align:center; color:#666;"><i class="fas fa-user-plus"></i><p>No friends yet</p><p style="font-size:12px;">Add friends using their username</p></div>`;
            return;
        }
        let html = '';
        for(const friendId of friends) {
            const status = await getStatus(friendId);
            const isOnline = status === 'online';
            html += `<div class="friend-item">
                <div class="avatar"><i class="fas fa-user-circle"></i><span class="${isOnline?'online-dot':'offline-dot'}"></span></div>
                <div class="friend-info"><div class="friend-name">${escapeHtml(friendId)}</div><div class="status-text">${isOnline?'Online':'Offline'}</div></div>
                <button class="call-btn" onclick="startCall('${friendId}')" ${!isOnline?'disabled':''}><i class="fas fa-video"></i></button>
            </div>`;
        }
        if(allSuggestions.length) {
            html += `<div style="margin-top:16px;"><p style="color:#888;">📌 Suggestions</p></div>`;
            for(const s of allSuggestions) {
                html += `<div class="friend-item" style="opacity:0.7;">
                    <div class="avatar"><i class="fas fa-user-plus"></i><span class="offline-dot"></span></div>
                    <div class="friend-info"><div class="friend-name">${escapeHtml(s)}</div><div class="status-text">Not a friend yet</div></div>
                    <button class="call-btn" onclick="sendFriendRequest('${s}')" style="background:#22c55e20; border-color:#22c55e; color:#22c55e;">Add</button>
                </div>`;
            }
        }
        container.innerHTML = html;
    }

    async function initUser() {
        const userRef = db.collection('users').doc(currentUserId);
        if(!(await userRef.get()).exists) await userRef.set({ username: currentUserId, displayName: currentUserId, friends: [], createdAt: new Date() });
        await loadFriends();
        setInterval(() => loadFriends(), 5000);
    }

    // --- Auth ---
    async function handleAuth() {
        const username = document.getElementById('username').value.trim().toLowerCase();
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('authError');
        const loginBtn = document.getElementById('loginBtn');
        if(!username) { errorDiv.innerText = 'Enter username'; return; }
        if(password.length < 4) { errorDiv.innerText = 'Password min 4 chars'; return; }
        loginBtn.disabled = true; loginBtn.innerText = 'Logging...';
        try {
            const userRef = db.collection('users').doc(username);
            const doc = await userRef.get();
            if(!doc.exists) {
                await userRef.set({ username, displayName: username, friends: [], passwordHash: btoa(password), createdAt: new Date() });
                errorDiv.innerText = '✅ Account created!';
            } else if(doc.data().passwordHash !== btoa(password)) {
                errorDiv.innerText = 'Wrong password';
                loginBtn.disabled = false; loginBtn.innerText = 'Login / Sign Up';
                return;
            }
            currentUserId = username;
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('appSection').classList.remove('hidden');
            await startHeartbeat();
            await initUser();
            listenForIncomingCalls();
            for(const u of demoUsers) if(u !== currentUserId) await setStatus(u, 'online');
            showToast(`Welcome ${username}`);
        } catch(e) { errorDiv.innerText = e.message; }
        finally { loginBtn.disabled = false; loginBtn.innerText = 'Login / Sign Up'; }
    }

    function logout() {
        if(heartbeatInterval) clearInterval(heartbeatInterval);
        if(callListenerUnsub) callListenerUnsub();
        if(signalListenerUnsub) signalListenerUnsub();
        if(currentUserId) setStatus(currentUserId, 'offline');
        if(peerConnection) endCall();
        currentUserId = null;
        document.getElementById('authSection').style.display = 'block';
        document.getElementById('appSection').classList.add('hidden');
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
    }

    function escapeHtml(str) { return String(str).replace(/[&<>]/g, m => m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }

    // Expose functions for global use
    window.startCall = startCall;
    window.acceptCall = acceptCall;
    window.declineCall = declineCall;
    window.sendFriendRequest = sendFriendRequest;
    window.toggleMic = toggleMic;
    window.toggleVideo = toggleVideo;
    window.toggleScreenShare = toggleScreenShare;
    window.toggleChat = toggleChat;
    window.sendChatMessage = sendChatMessage;
    window.joinGroupCall = joinGroupCall;

    // Add event listeners
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('loginBtn').onclick = handleAuth;
        document.getElementById('logoutBtn').onclick = logout;
        document.getElementById('startGroupCallBtn').onclick = createNewGroupCall;
        document.getElementById('joinGroupCallBtn').onclick = () => {
            const room = document.getElementById('groupRoomInput').value.trim();
            if(room) joinGroupCall(room);
            else showToast("Enter a room name");
        };
        document.getElementById('endCallBtn').onclick = endCall;
        document.getElementById('addFriendBtn').onclick = () => {
            const name = document.getElementById('addFriendInput').value.trim().toLowerCase();
            if(name) sendFriendRequest(name);
        };
        document.getElementById('toggleMicBtn').onclick = toggleMic;
        document.getElementById('toggleVideoBtn').onclick = toggleVideo;
        document.getElementById('screenShareBtn').onclick = toggleScreenShare;
        document.getElementById('toggleChatBtn').onclick = toggleChat;
        document.getElementById('sendChatBtn').onclick = sendChatMessage;
        document.getElementById('chatInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') sendChatMessage(); });
        document.getElementById('username').addEventListener('keypress', (e) => { if(e.key === 'Enter') handleAuth(); });
        document.getElementById('password').addEventListener('keypress', (e) => { if(e.key === 'Enter') handleAuth(); });
    });
</script>
</body>
</html>
